<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blush &amp; Burgundy – Bras | Triumph</title>
<style>
/* ============================================================
   FONTS (local — Alliance No.1 Light + Regular)
   ============================================================ */
@font-face {
  font-family: "Alliance No1";
  src: url("./fonts/AllianceNo1-Light.otf") format("opentype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Alliance No1";
  src: url("./fonts/AllianceNo1-Regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

/* ============================================================
   DESIGN TOKENS (from Figma)
   ============================================================ */
:root {
  --c-bg:        #FFFFFF;
  --c-ink:       #000000;
  --c-ink-soft:  rgba(0,0,0,.5);
  --c-line:      #DADADA;
  --c-offwhite:  #F8F3F3;
  --c-burgundy:  #5E2039;
  /* filter sheet (Figma 21-5889): hairlines between facets, a heavier edge
     under the header / over the footer, and the selected-row wash */
  --c-hair:      rgba(0,0,0,.05);
  --c-edge:      rgba(0,0,0,.2);
  --c-wash:      #F9FAFB;

  --font-sans: "Alliance No1", "Inter", "Helvetica Neue", Arial, sans-serif;

  --pad-x: 24px;
  --header-h: 80px; /* measured on load (see JS) — sticky offset for the results bar */
  /* fluid: ~51px on a 1280 desktop, ~58px at 1440, full 84px (60px + 40%) from ~2100px up */
  --row-gap: clamp(48px, 4vw, 84px);

  --ease-out: cubic-bezier(.22,.61,.36,1);
  --ease-reveal: cubic-bezier(.22,1,.36,1);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: clip; }
body {
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: -0.02em;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3 { margin: 0; font-weight: 400; }

/* ============================================================
   HEADER (same as PDP prototype)
   ============================================================ */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--c-bg);
}
.nav {
  max-width: 2400px; margin: 0 auto;
  padding: 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.logo { display: inline-flex; align-items: center; flex: none; }
.logo__img { width: 156px; height: 20px; display: block; }
.nav__links { display: flex; gap: 24px; }
.nav__links a {
  font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  font-weight: 300;
  padding-bottom: 2px;
  transition: color .25s var(--ease-out);
}
.nav__links a:hover { color: #747474; } /* grey/medium — Figma 637-2373 hover state */
.nav__right { display: flex; align-items: center; gap: 20px; }
.search {
  display: flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 16px 0 8px;
  background: #F1F1F1;
}
.search svg { width: 16px; height: 16px; fill: none; stroke: var(--c-ink); stroke-width: 1; flex: none; }
.search input {
  border: 0; outline: 0; background: transparent;
  font-family: inherit; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  font-weight: 300;
  width: 64px; color: var(--c-ink);
}
.search input::placeholder { color: var(--c-ink); opacity: 1; }
.nav__icons { display: flex; align-items: center; gap: 20px; }
.nav__icons .icon { width: 18px; height: 18px; fill: none; stroke: var(--c-ink); stroke-width: 1.2; }
.nav__icons button[aria-label="Cart"] { display: inline-flex; align-items: flex-start; gap: 2px; }
.cart-count { font-size: 12px; font-weight: 300; letter-spacing: .04em; line-height: 1; }
.burger { display: none; }
.burger svg { width: 20px; height: 8px; fill: none; stroke: var(--c-ink); stroke-width: 1.2; display: block; }

/* ============================================================
   BREADCRUMB — HOME / BRAS / BLUSH & BURGUNDY
   ============================================================ */
.breadcrumb {
  max-width: 2400px; margin: 0 auto;
  display: flex; gap: 8px; align-items: center;
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 300;
  color: var(--c-ink);
  padding: 8px var(--pad-x) 24px;
}
.breadcrumb b { font-weight: 300; color: var(--c-ink-soft); }
.breadcrumb span { opacity: .4; }

/* ============================================================
   HERO — burgundy petal "List Interuptor" 1440x440
   ============================================================ */
.hero {
  position: relative;
  /* 500px up to 1440px viewports, then the banner keeps its proportion
     (500/1440 ≈ 34.72vw) as the screen grows, capped at 700px (~2016px+)
     so the first product row still peeks above the fold on big displays */
  height: clamp(500px, 34.72vw, 700px);
  overflow: hidden;
  display: flex; align-items: center; justify-content: flex-start;
}
.hero img, .hero video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  animation: heroIn 1.6s var(--ease-out) both;
}
/* mild darkening only — keeps the white title legible, no pink/red cast
   (the burgundy tint wash + red-shifted grade were removed on request) */
.hero video { filter: brightness(.85) contrast(1.03); }
/* film grain — retro noise */
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: .3;
  mix-blend-mode: overlay;
}
@keyframes heroIn {
  from { transform: scale(1.06); }
  to   { transform: scale(1); }
}
/* the title fades in once the video has played through */
.hero h1 {
  position: relative; z-index: 2;
  width: 100%;
  /* same centred 2400px box as the breadcrumb, so the title never
     starts further left than it on very wide screens */
  max-width: 2400px;
  margin: 0 auto;
  padding: 0 var(--pad-x);
  color: #fff;
  font-weight: 400;
  font-size: 20px;
  letter-spacing: .04em;
  text-transform: uppercase;
  text-align: left;
  opacity: 0; transform: translateY(10px);
  transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out);
}
.hero.is-ended h1 { opacity: 1; transform: translateY(0); }

/* ============================================================
   RESULTS ROW — title left, filters right (Figma 937-27214)
   three filter variants share the row; the version decides
   ============================================================ */
.results-bar { background: var(--c-bg); }
.results-row {
  max-width: 2400px; margin: 0 auto;
  /* Top-aligned on the type, not on the boxes. `flex-start` would sit the
     boxes' edges level, and since the title's line box is 24px against the
     chips' 16px, its caps would land 4.5px low (measured). `baseline` puts
     the title on the same baseline as the FIRST chip line instead — same
     font at the same size, so a shared baseline is a shared cap line, with
     no magic number to re-derive if the type changes. Wrapped chip lines
     then grow downwards and leave the title where it was. */
  display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
  /* --pad-x is also the grid's side padding, so the title and the filters
     line up with the first and last card */
  padding: 36px var(--pad-x);
}
.results-title {
  font-size: 12px; line-height: 24px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400;
  /* holds its own width so the filters wrap before the title does; it only
     gives way once the widest chip no longer fits beside it */
  flex: 0 1 auto; min-width: 0;
}
.results-title .count {
  font-size: 12px; font-weight: 300; color: var(--c-ink-soft);
  /* the brackets dip below the baseline, which drops the group's optical
     centre ~0.5px under the title's caps — lift it back level */
  position: relative; bottom: .5px;
}
.results-title .nowrap { white-space: nowrap; }
/* Long translations (DE "SORTIEREN NACH: NEUHEITEN", "NACHHALTIGKEITS-
   STANDARDS", …) can outgrow the space left of the grid edge. The chip row
   takes whatever width remains beside the title and wraps inside it, every
   line still flush right — so a wrapped set never crosses the page's
   centre or pushes the title off its own line.
   flex-basis 0 is what makes that predictable: the row claims the leftover
   space rather than its content width, so the title keeps its size and
   only the chips reflow. min-width stays auto, so if even the widest chip
   won't fit next to the title, the title yields instead of the chip
   overflowing the page. */
.filters {
  display: none; flex: 1 1 0;
  flex-wrap: wrap; justify-content: flex-end; align-items: center;
  gap: 12px 20px; /* 12px between wrapped lines, 20px between chips */
}
.filters button, .filters-single, .filters-mobile {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; line-height: 16px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400;
  white-space: nowrap;
}
.filters button svg { width: 7px; height: 4px; fill: none; stroke: var(--c-ink); stroke-width: 1; flex: none; }
.filters button .plus, .filters-single svg, .filters-mobile svg { width: 10px; height: 10px; fill: none; stroke: var(--c-ink); stroke-width: 1; flex: none; }
.filters button:hover, .filters-single:hover, .filters-mobile:hover { opacity: .55; }
.filters-single { display: none; }
.filters-mobile { display: none; }
/* the row's selected state (Figma 1-1328): the applied count beside each
   chip label, and a Reset filters link at the end of the row */
.chip__n { color: var(--c-ink-soft); }
.chip__n:empty { display: none; }
.filters__reset {
  text-decoration: underline; text-underline-offset: 3px;
}
.filters__reset[hidden] { display: none; }

/* Filter V1 — chip dropdown (Figma 931-26774) */
.results-row { position: relative; }
/* A column: the options scroll, the foot is a real footer beneath them.
   The foot used to be the last thing in the dropdown's own scroll and then
   a sticky overlay — both leaked. Sticky floats the foot at the scrollport
   bottom, but the dropdown's bottom padding sits *below* that, so option
   rows showed through the strip under Reset. Taking the foot out of the
   scrolling box removes the class of bug rather than patching it. */
.dropdown {
  position: absolute; z-index: 60;
  width: 240px;
  background: #fff;
  border: 1px solid var(--c-ink);
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  /* JS narrows this to the room beside the chip — see anchorDropdown */
  max-height: min(480px, 60vh);
  display: none; flex-direction: column;
  overflow: hidden; /* nothing can escape past the foot */
  /* The 4px opening inset lives here, NOT on .dropdown__scroll. Chromium
     resolves a sticky `top: 0` against the scroller's *content* box, so a
     padding-top on the scroller parks the sticky group head 4px low and
     leaves a 4px window for rows to scroll through behind it. Above the
     scrollport the strip cannot be scrolled into. */
  padding-top: 4px;
}
/* the size grid needs 5 columns of chips — 240px cannot hold them
   (Figma 1-1275 draws this variant at 367px). Keep DD_WIDTH in step. */
.dropdown[data-facet="size"] { width: 367px; }
.dropdown.is-open { display: flex; }
.dropdown__scroll {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;
}
.dropdown__row {
  display: flex; gap: 12px; align-items: center;
  width: 100%; padding: 10px 12px;
  font-size: 12px; line-height: 16px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400; text-align: left;
  transition: background .15s;
}
.dropdown__row:hover, .dropdown__row[data-on="true"] { background: #F9FAFB; }
.dropdown__row .sw { width: 20px; height: 20px; flex: none; border: 1px solid rgba(0,0,0,.08); }
.dropdown__row .lbl { flex: 1; }
.dropdown__row .tick {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: var(--c-ink); stroke-width: 1.5;
  opacity: 0;
}
.dropdown__row[data-on="true"] .tick { opacity: 1; }
/* the "More" dropdown — each filter expands its options in place */
.dd-group__head {
  display: flex; gap: 12px; align-items: center;
  width: 100%; padding: 10px 12px;
  font-size: 12px; line-height: 16px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400; text-align: left;
  transition: background .15s;
}
.dd-group__head:hover { background: #F9FAFB; }
.dd-group__head .lbl { flex: 1; }
.dd-group__head .chev {
  width: 7px; height: 4px; flex: none;
  fill: none; stroke: var(--c-ink); stroke-width: 1;
  transition: transform .2s var(--ease-out);
}
.dd-group__head[data-open="true"] .chev { transform: rotate(180deg); }
/* options one step below the 12px group heads — same hierarchy as the drawer */
.dd-group__body .dropdown__row { padding-left: 24px; font-size: 11px; }
.dropdown__row .cnt { color: var(--c-ink-soft); }
.dropdown__row .nw { white-space: nowrap; } /* keeps the count off its own line */

/* ---- Series inside the More dropdown (Figma 1-1272) ----
   A search field, then the two-level family list. The list gets its own
   scroller: the catalogue is far longer than a 240px dropdown can show, and
   the dev ask was specifically for the scroll-within-a-scroll — the series
   list scrolls inside the dropdown, which scrolls inside the page.
   The search stays pinned above the scroller so it can't scroll out of
   reach of the list it filters. */
.dd-srch { position: relative; padding: 8px 8px 4px; }
.dd-srch input {
  width: 100%; height: 40px; padding: 0 44px 0 12px; /* clears the magnifier */
  border: 1px solid var(--c-edge); background: var(--c-wash); color: inherit;
  font-family: inherit;
  font-size: 10px; line-height: 12px; letter-spacing: .04em; text-transform: uppercase;
  -webkit-appearance: none; appearance: none;
}
.dd-srch input::placeholder { color: var(--c-ink); text-transform: uppercase; }
.dd-srch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.dd-srch input:focus { outline: none; border-color: var(--c-ink); }
/* the 24px icon box of the design, with the project's own magnifier in it.
   The design's 8px right inset put the glyph 13px off the field edge against
   a 12px text inset on the left, which read tighter than the left because the
   magnifier's ink reaches its box corner while a letter does not — 18px is
   the optical match. */
.dd-srch svg {
  position: absolute; right: 18px; top: 21px;
  width: 14px; height: 14px;
  fill: none; stroke: var(--c-ink); stroke-width: 1.1; pointer-events: none;
}
/* ---- product view switch, head of the More panel (Figma 1-2313) ----
   The same control as the mobile sheet's, at the desktop size the design
   gives it: a 36px row on the panel's 12px inset, a 32x18 switch instead of
   the sheet's 40x22, closed by the panel's own hairline. It is a view
   control, not a facet, which is what the divider is saying. */
/* min-height, not height: "Show products on model" needs 187px on one line
   and a 240px panel leaves it 170px, so it takes two. The design draws it
   nowrap at this width and simply clips — a fixed 36px here did the same,
   dropping the second line onto the Fabric row. 10px of padding gives the
   design's 36px exactly when the label does fit on one line. */
.dd-pview {
  display: flex; align-items: center; gap: 12px;
  min-height: 36px; padding: 10px 12px;
  border-bottom: 1px solid var(--c-hair);
}
.dd-pview span {
  flex: 1;
  font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase;
}
/* 32x18 with a 14px knob and 2px of travel room, the same proportions as the
   40x22 original. Doubled-up selector on purpose: the base .switch rules live
   further down in the drawer's block, so an equal-specificity modifier up
   here would lose on source order. */
.switch.switch--sm { width: 32px; height: 18px; }
.switch.switch--sm i { top: 2px; left: 16px; width: 14px; height: 14px; }
.switch.switch--sm[aria-checked="false"] i { left: 2px; }

/* ---- size grid (Figma 1-1275) ----
   Two labelled blocks, 5 across, 8px gutters, 30px rows (the design's 68px
   two-row box less its 8px gap). Chips are hairline #DDD at rest, the ink
   outline on hover and solid ink when chosen — border-colour rather than
   border-width so a selected chip never shifts its neighbours by half a
   pixel. Labels are Light 12/16, the design's Label/Default/M. */
.dd-grids { display: flex; flex-direction: column; gap: 16px; padding: 8px 12px 12px; }
.dd-grid-block { display: flex; flex-direction: column; gap: 12px; }
.dd-grid__lb {
  font-size: 12px; line-height: 16px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 300;
}
.dd-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px; grid-auto-rows: 30px;
}
.dd-grid button {
  display: flex; align-items: center; justify-content: center;
  padding: 4px;
  border: .5px solid #DDDDDD; background: transparent; color: var(--c-ink);
  font-size: 12px; line-height: 16px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 300;
  transition: background .15s, border-color .15s, color .15s;
}
.dd-grid button:hover { border-color: var(--c-ink); }
.dd-grid button[data-on="true"] {
  background: var(--c-ink); border-color: var(--c-ink); color: #fff;
}

.dd-item[hidden] { display: none; }
.dd-srch-empty {
  padding: 10px 12px 14px 24px;
  font-size: 11px; line-height: 14px; font-weight: 300;
  letter-spacing: .04em; color: var(--c-ink-soft);
}

/* ---- one scroller, not two ----
   The series list used to be a 280px scroller nested inside the panel's own
   scroller. The two never scaled together — the 280px was fixed while the
   panel was 60vh, so the shorter the window the more of the panel one list
   ate (58% of it at 900px tall, 83% at 560px) and the search, the group
   heads and Reset were what got pushed out of sight. It also showed the same
   7 of 26 rows at every screen height, because the list could not grow.
   Now the list runs at its natural length and the panel body is the only
   scroller, so the list takes ALL the space left over. The group head and
   its search stick to the top of that scroller, which is what the nested box
   was really there to achieve. */
/* each head is sticky inside its own group, so it leads its options down and
   then leaves with them — no stack of piled-up headers */
.dd-group__head {
  position: sticky; top: 0; z-index: 3;
  background: #fff;
}
.dd-group__head:hover,
.dd-group__head[data-open="true"] { background: var(--c-wash); }
/* the search sits directly under its head and stays reachable: it filters
   the list you are scrolling, so it must not scroll away from it.
   Both offsets are measured from the scrollport's top, which is why the
   panel's 4px opening inset has to live on .dropdown and not here. */
.dd-srch {
  position: sticky; top: 36px; z-index: 2; /* 36px = the head's row height */
  background: #fff;
}
/* a flipped panel grows upward from the chip */
.dropdown[data-flip="true"] { box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
/* Outside the scroller, so Reset is always reachable however deep the
   series list is scrolled. The hairline is inset 12px on
   .dropdown__actions — the Foot > Actions split of the Figma node. */
.dropdown__foot {
  flex: none;
  background: #fff;
  padding: 4px 12px 8px;
  font-size: 14px; line-height: 20px; letter-spacing: .04em; text-transform: uppercase;
}
.dropdown__foot[hidden] { display: none; }
.dropdown__actions {
  display: flex; justify-content: space-between;
  border-top: 1px solid var(--c-line);
  padding: 14px 0 2px;
}
/* 12px underlined, matching both dropdown nodes and the drawer's own
   "Reset filters" — the 14px unstyled "Reset" was the odd one out */
.dropdown__foot button {
  font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase;
  text-decoration: underline; text-underline-offset: 3px;
}
.dropdown__foot button:hover { opacity: .55; }

/* which filter row shows — the dashboard "Filters" control */
body[data-filters="all"] .filters--full { display: flex; }
body[data-filters="some"] .filters--reduced { display: flex; }
body[data-filters="none"] .filters-single { display: inline-flex; }

/* ============================================================
   GRID — 4 columns; card gap + side padding from the dashboard
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-flow: dense;
  row-gap: var(--row-gap);
  margin-bottom: 120px;
  /* 24px between the cards and 24px down each side — the same as --pad-x,
     so the breadcrumb, hero title and results row all line up with the
     first card. Mobile drops the side padding to zero (≤760px block). */
  column-gap: 24px;
  padding: 0 var(--pad-x);
}
.card { cursor: pointer; } /* whole card opens the PDP (colour controls excepted) */
.card, .ed {
  position: relative;
  /* scroll reveal — blurred rise-and-fade, row by row */
  opacity: 0;
  transform: translateY(28px);
  filter: blur(3px);
  transition: opacity 1.4s var(--ease-reveal),
              transform 1.4s var(--ease-reveal),
              filter 1.4s var(--ease-reveal);
}
.card.is-visible, .ed.is-visible { opacity: 1; transform: none; filter: none; }
@media (prefers-reduced-motion: reduce) {
  .card, .ed { opacity: 1; transform: none; filter: none; transition: none; }
}

.card__img {
  position: relative;
  aspect-ratio: 688 / 905; /* Figma card image */
  overflow: hidden;
  background: var(--c-offwhite);
}
.card__img .ph {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .9s var(--ease-out);
}
/* Same gesture as the PDP grid tiles (.gallery__tile — .9s ease-out to 1.04),
   and it applies to EVERY layer, not just the base. The card also crossfades
   a second shot in on hover, so if only .ph--base scaled, the incoming photo
   would sit dead still on top and swallow the whole movement. Zooming the
   stack means the crossfade happens mid-zoom and the motion carries through
   the photo change.
   Pointer devices only — on touch this fires on tap and the zoom sticks
   until you tap elsewhere, which reads as a bug. */
@media (hover: hover) {
  .card:hover .card__img .ph { transform: scale(1.04); }
}
/* Both overlay layers restate the zoom alongside their fade. `transition` is
   a shorthand, so declaring only opacity here would drop the transform
   transition inherited from .ph and the overlay would snap to 1.04 instead
   of easing into it — the snap is invisible on the base but very visible on
   the shot that fades in over the top. */
/* variant overlay photo — crossfades on top of the base */
.card__img .ph--variant {
  opacity: 0;
  transition: opacity .38s var(--ease-out), transform .9s var(--ease-out);
  background: #fff;
}
.card__img .ph--variant.is-on { opacity: 1; }

/* hover gallery — a different photo fades in, chevrons page through 4 */
.card__img .ph--hover {
  opacity: 0;
  transition: opacity .38s var(--ease-out), transform .9s var(--ease-out);
  background: #fff;
}
.card__img .ph--hover.is-on { opacity: 1; }
.gal-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 4;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s var(--ease-out);
}
.gal-nav svg { width: 12px; height: 12px; fill: none; stroke: var(--c-ink); stroke-width: 1.2; transition: transform .2s var(--ease-out); }
.gal-nav:hover svg { transform: scale(1.25); }
.gal-nav--prev { left: 12px; }
.gal-nav--next { right: 12px; }
.card__img:hover .gal-nav { opacity: 1; pointer-events: auto; }
@media (hover: none) { .gal-nav { display: none; } }

/* wishlist heart — black outline, top right of every product photo, hidden
   at rest: it fades in only while the card is hovered (or once favourited,
   so a selected heart never disappears). On touch devices it's always shown. */
.wish {
  /* top is 1px less than right: the heart glyph sits ~1px lower inside its
     box than it does from the right, so equal offsets read as more top gap */
  position: absolute; top: 15px; right: 16px; z-index: 6;
  width: 24px; height: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .28s var(--ease-out), transform .2s var(--ease-out);
}
.card:hover .wish,
.wish[data-on="true"] { opacity: 1; pointer-events: auto; }
@media (hover: none) {
  .wish { opacity: 1; pointer-events: auto; }
}
.wish svg {
  width: 24px; height: 24px;
  fill: none; stroke: var(--c-ink); stroke-width: 1;
  transition: fill .2s var(--ease-out), transform .2s var(--ease-out);
}
.wish:hover svg { transform: scale(1.1); }
.wish[data-on="true"] svg { fill: var(--c-ink); }
/* two glyphs from the saved favorite*.svg files — the outline (.ho)
   shows at rest, the solid heart (.hs) joins it when selected, which
   reads much crisper than tinting the 1px outline */
.wish svg .hs { display: none; stroke: none; }
.wish[data-on="true"] svg .hs { display: block; }

/* ============================================================
   SALES BANNER — the solid pink "SALE" badge, bottom-left of the photo
   (--surface/sales #C1003F; Figma 1135-22770 / 1273-24563). The four
   translucent-wordmark alternatives were dropped 2026-07-30; this is now
   the only treatment. Rendered only on cards that carry sale data.
   ============================================================ */
.sale-flag {
  display: inline-flex; align-items: baseline; justify-content: center;
  position: absolute; left: 12px; bottom: 12px; z-index: 4;
  padding: 2px 8px 0;
  background: #C1003F; color: #fff;
  font-size: 14px; line-height: 20px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400; white-space: nowrap;
}

/* ============================================================
   CARD INFO — title / price / colour label; the colour label always
   wraps onto its own line below the price
   ============================================================ */
.card__info { position: relative; padding: 16px 12px 0; } /* 12px insets on both sides (mobile keeps its own) */
.card__cat {
  font-size: 12px; line-height: 20px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400;
}
.card__pr {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  margin-top: 4px; padding-top: 2px;
  font-size: 12px; line-height: 14px;
}
/* MARKDOWN vs MEMBERSHIP — two states a card can be in, never both.
   Member pricing is only granted on products that are NOT on sale, so the
   PRODUCTS data gives a card either `sale` or `mem`:
     sale → SALE badge on the photo + struck original + reduced price
     mem  → no badge, plain price + the member rate
   Both are always on now — the plain-price "Standard" option was dropped
   2026-07-31. Burgundy is reserved for membership: a markdown is plain
   black, and only the member price and its wording carry the colour. */
.card__pr.is-sale > .pr-now { text-decoration: line-through; color: var(--c-ink-soft); }
.card__sale {
  font-size: inherit; line-height: 14px; /* matches the regular price at every breakpoint */
  color: var(--c-ink);
}
/* member price — settled 2026-08-31 on the old V2, the only version left:
   the price reads as a sentence closing on the crown, "£53.95 FOR MEMBERS ♛".
   The plain "Member price £x" label (V1) and the price-plus-MEMBER-PRICE-chip
   (V3) are gone, along with the dashboard group that switched between them.
   Burgundy, per the 2026-07-31 decision.

   ONE spacing token for the whole line: .card__pr is a flex row with its
   own gap:4px, which lands only on .mem's left — so the margin subtracts
   it and every gap on the line, inside .mem or out, comes to --mem-gap. */
.mem {
  --mem-gap: 8px;
  margin-left: calc(var(--mem-gap) - 4px);
  color: var(--c-burgundy);
}

/* the Triumph crown (Assets/plp/triumph-crown.svg, path copied verbatim so
   it can take currentColor). Sized in em so it tracks the price at both
   breakpoints, and dropped onto the figures' optical centre, not the
   baseline: they sit 0..~0.71em above it, so the middle is ~0.355em up
   and the crown's own half-height comes off that. */
.crown {
  width: .977em; height: .85em; /* the asset's own 23:20 ratio */
  flex: none;
  fill: currentColor;
  /* centred on the figures, not the baseline: they sit 0..~0.71em above it,
     so their optical middle is ~0.355em up and the crown's own half-height
     comes off that. em-relative, so it holds at both the 12px desktop and
     10px mobile price size. */
  position: relative; bottom: calc(0.355em - 0.425em);
  margin-left: 5px;
}

.cvar__label {
  flex-basis: 100%; /* wraps onto its own line below the price */
  margin-top: 3px;  /* + the row's 4px gap ≈ the old 7px offset */
  text-align: left;
  font-size: 12px; line-height: 14px; font-weight: 400;
  transition: opacity .2s var(--ease-out);
}
@media (hover: hover) { .cvar__label:hover { opacity: .55; } }

/* ============================================================
   EXPANDING COLOUR PANEL — covers the info area on open
   swatches from /Colour Swatches (black · red · mauve lace)
   ============================================================ */
.panel {
  position: absolute; inset: 0;
  z-index: 5;
  display: flex; gap: 6px; align-items: center;
  padding: 12px; /* swatches line up with the 12px text inset */
  background: #fff;
  opacity: 0; pointer-events: none;
  transform: translateY(6px);
  transition: opacity .32s var(--ease-out), transform .32s var(--ease-out);
}
.card.is-open .panel { opacity: 1; pointer-events: auto; transform: translateY(0); }
.thumb {
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: border-color .2s var(--ease-out);
  flex: none;
}
.thumb img { width: 44px; height: 44px; object-fit: cover; background: #fff; border: 1px solid rgba(0,0,0,.06); }
@media (hover: hover) { .thumb:hover { border-bottom-color: var(--c-line); } }
.thumb[data-sel="true"] { border-bottom-color: var(--c-ink); }
/* the currently worn colour — product photo cropped to the bra */
.thumb--current img { object-position: 50% 22%; }

/* ============================================================
   EDITORIAL INTERRUPTORS — car (row 2 + last row) and lips (tall)
   base: full-bleed; versions add insets (see below)
   ============================================================ */
.ed { overflow: hidden; }
.ed img { width: 100%; height: 100%; object-fit: cover; }
.ed--row2, .ed--last, .ed--tall { grid-column: span 2; align-self: start; }
.ed--row2 img { object-position: 50% 55%; transform: scale(1.15); } /* peony bouquet — zoomed in slightly */
.ed--last img { object-position: 50% 50%; } /* hydrangea face close-up */
.ed--tall img { object-position: 50% 15%; } /* pink-memories mood — focus the top centre (the sign) */

/* "Triumph live" images — a pure product grid: no editorial/mood tiles,
   whatever the view; the cards close ranks over the freed slots */
body[data-images="live"] .ed { display: none; }

/* CONTENT TYPES view — the tall slot plays a video, the last slot
   shows a screenshot with a "Discover this product" CTA; the media
   swap is scoped to this view only */
.ed video {
  display: none;
  width: 100%; height: 100%; object-fit: cover;
}
body[data-view="content"] .ed--tall img { display: none; }
body[data-view="content"] .ed--tall video { display: block; }
body[data-view="content"] .ed--last img { object-position: 50% 0; }
/* CTA — frosted badge from Figma 727-2261: white 20% + 10px blur,
   Alliance Regular 14/20, 4% tracking, uppercase, 10px padding */
.mood-cta {
  position: absolute; left: 24px; bottom: 24px;
  z-index: 3;
  display: none; align-items: center; justify-content: center;
  padding: 10px;
  font-size: 14px; line-height: 20px; letter-spacing: .04em;
  text-transform: uppercase; font-weight: 400; white-space: nowrap;
  color: var(--c-ink);
  background: rgba(255,255,255,.2);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: background .25s var(--ease-out);
}
.mood-cta:hover { background: rgba(255,255,255,.4); }
body[data-view="content"] .ed--last .mood-cta { display: flex; }

/* ============================================================
   FILTER & SORT PANEL
   desktop: 420px off-canvas drawer, Filter V2 (Figma 931-25755)
   mobile:  bottom sheet (Figma 21-5889 "FILTER – MOBILE")

   One DOM, one renderer, one set of facet components — only the
   chrome and the density change at the breakpoint. --sheet-pad is
   the single inset every part reads, so a selected row can run
   full-bleed to the panel edge at either width.
   ============================================================ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.4);
  opacity: 0; pointer-events: none;
  transition: opacity .35s var(--ease-out);
}
body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
.drawer {
  --sheet-pad: 24px; /* every inset in the panel derives from this */
  --head-h: 52px;    /* facet head row */
  --row-h: 44px;     /* option row */
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 95;
  width: 420px; max-width: 92vw;
  background: #fff;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  visibility: hidden; /* fully out of the layout when closed — keeps mobile from widening */
  transition: transform .45s var(--ease-out), visibility 0s .45s;
}
body.drawer-open .drawer {
  transform: translateX(0);
  visibility: visible;
  transition: transform .45s var(--ease-out);
}
/* the grab bar only exists on the mobile sheet (see the sheet block below) */
.drawer__grab { display: none; }

.drawer__head {
  flex: none;
  height: 72px; padding: 0 var(--sheet-pad);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--c-edge);
}
.drawer__title { font-size: 14px; line-height: 20px; letter-spacing: .04em; text-transform: uppercase; }
/* "(6)" — how many filters are set (Figma note 1-1785) */
.drawer__n { font-style: normal; color: var(--c-ink-soft); }
.drawer__n:empty { display: none; }
.drawer__close { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin-right: -5px; }
.drawer__close svg { width: 14px; height: 14px; fill: none; stroke: var(--c-ink); stroke-width: 1.2; }
.drawer__close:hover { opacity: .5; }
.drawer__body {
  flex: 1; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0; /* the rows carry their own insets so they can run full-bleed */
}

/* ---- product view toggle — pinned above the facets (Figma 1-2313) ---- */
.pview {
  display: flex; align-items: center; gap: 12px;
  height: var(--head-h); padding: 0 var(--sheet-pad);
  border-bottom: 1px solid var(--c-hair);
}
.pview span { flex: 1; font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase; }
.switch {
  flex: none; position: relative;
  width: 40px; height: 22px; border-radius: 999px;
  background: var(--c-ink);
  transition: background .25s var(--ease-out), box-shadow .25s var(--ease-out);
}
.switch i {
  position: absolute; top: 3px; left: 21px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff;
  transition: left .25s var(--ease-out), background .25s var(--ease-out);
}
.switch[aria-checked="false"] { background: #fff; box-shadow: inset 0 0 0 1px var(--c-ink); }
.switch[aria-checked="false"] i { left: 3px; background: var(--c-ink); }

/* ---- facet ---- */
.facet { border-bottom: 1px solid var(--c-hair); }
.facet__head {
  width: 100%;
  display: flex; align-items: center; gap: 12px;
  height: var(--head-h); padding: 0 var(--sheet-pad);
  text-align: left;
}
.facet__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.facet__lb { font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase; }
/* per-facet selection count, and the current value under "Sort by" */
.facet__n { font-style: normal; color: var(--c-ink-soft); }
.facet__n:empty { display: none; }
.facet__val { font-size: 10px; line-height: 12px; font-weight: 300; color: var(--c-ink-soft); }
.facet__head svg {
  width: 10px; height: 6px; fill: none; stroke: var(--c-ink); stroke-width: 1; flex: none;
  transition: transform .3s var(--ease-out);
}
.facet.is-open > .facet__head svg { transform: rotate(180deg); }
.facet__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease-out); }
.facet.is-open > .facet__body { grid-template-rows: 1fr; }
.facet__inner { overflow: hidden; min-height: 0; }

/* ---- option row: list, radio and the nested series children ---- */
.opt {
  width: 100%; height: var(--row-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 var(--sheet-pad);
  font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase;
  text-align: left;
  transition: background .2s;
}
.opt i { font-style: normal; color: var(--c-ink-soft); }
.opt__tick { flex: none; margin-left: auto; width: 10px; height: 8px; fill: none; stroke: var(--c-ink); stroke-width: 1.2; opacity: 0; }
.opt[data-on="true"] { background: var(--c-wash); }
.opt[data-on="true"] .opt__tick { opacity: 1; }
.opt:hover { background: var(--c-wash); }

/* ---- size grids — underbust + cup, 5 across (Figma 1-77 / 1-213) ---- */
.grids { display: flex; flex-direction: column; gap: 20px; padding: 4px var(--sheet-pad) 24px; }
.grid-lb { font-size: 12px; line-height: 16px; font-weight: 300; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 12px; }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chips button {
  height: 30px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 .5px var(--c-line);
  font-size: 12px; letter-spacing: .04em;
  transition: background .18s, color .18s, box-shadow .18s;
}
.chips button:hover { box-shadow: inset 0 0 0 1px var(--c-ink); }
.chips button[data-on="true"] { background: var(--c-ink); color: #fff; box-shadow: none; }

/* ---- colour swatches — one horizontal scroller (Figma note 1-1776) ---- */
.cols {
  display: flex; gap: 16px;
  padding: 4px 0 24px var(--sheet-pad);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.cols::-webkit-scrollbar { display: none; }
.cols::after { content: ""; flex: none; width: calc(var(--sheet-pad) - 16px); } /* trailing inset */
/* 64px is the floor, not the cap: the item widens to whatever its caption
   needs so a long name like "BURGUNDY (12)" stays on one line, and the
   56px swatch simply centres over it */
.col { flex: none; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.col__sw { padding: 4px; transition: box-shadow .18s; }
.col__sw img { display: block; width: 56px; height: 56px; object-fit: cover; }
.col:hover .col__sw { box-shadow: inset 0 0 0 1px var(--c-line); }
.col[data-on="true"] .col__sw { box-shadow: inset 0 0 0 1px var(--c-ink); }
.col__lb { font-size: 11px; line-height: 14px; letter-spacing: .04em; text-transform: uppercase; text-align: center; white-space: nowrap; }
.col__lb i { font-style: normal; color: var(--c-ink-soft); }

/* ---- price · option A: min/max + range (the preferred one, Figma note 1-1779) ---- */
.facet--price .pr-b { display: none; }
body[data-price="b"] .facet--price .pr-a { display: none; }
body[data-price="b"] .facet--price .pr-b { display: block; }
.pr-a { padding: 4px var(--sheet-pad) 28px; }
.pr__fields { display: flex; align-items: center; gap: 8px; }
.pr__box {
  flex: 1; min-width: 0; height: 52px; padding: 0 12px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  box-shadow: inset 0 0 0 1px var(--c-line);
  transition: box-shadow .18s;
}
.pr__box:focus-within { box-shadow: inset 0 0 0 1px var(--c-ink); }
.pr__box span { font-size: 10px; line-height: 12px; font-weight: 300; color: var(--c-ink-soft); }
.pr__box input {
  width: 100%; border: 0; padding: 0; background: none; color: inherit;
  font-family: inherit; font-size: 12px; line-height: 16px; letter-spacing: .04em;
}
.pr__box input:focus { outline: none; }
.pr__dash { flex: none; font-style: normal; color: var(--c-ink-soft); }
.pr__slider { position: relative; height: 16px; margin-top: 24px; }
.pr__track, .pr__fill { position: absolute; top: 7.5px; height: 1px; }
.pr__track { left: 8px; right: 8px; background: var(--c-line); }
.pr__fill { background: var(--c-ink); }
.pr__r {
  position: absolute; left: 0; width: 100%; top: 0; height: 16px;
  margin: 0; padding: 0; background: none;
  -webkit-appearance: none; appearance: none;
  pointer-events: none; /* only the thumbs take the pointer, so both are reachable */
}
.pr__r:focus { outline: none; }
.pr__r::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; border: 1px solid #999; cursor: grab;
}
.pr__r::-moz-range-thumb {
  pointer-events: auto;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 1px solid #999; cursor: grab;
}

/* ---- series — search + grouped list (Figma 1-1205, note 1-1782) ---- */
.srch { position: relative; margin: 4px var(--sheet-pad) 8px; }
.srch input {
  width: 100%; height: 44px; padding: 0 40px 0 12px;
  border: 0; background: rgba(0,0,0,.03); color: inherit;
  font-family: inherit; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  -webkit-appearance: none; appearance: none;
}
.srch input::placeholder { color: var(--c-ink-soft); text-transform: uppercase; }
.srch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.srch input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--c-ink); }
.srch svg { position: absolute; right: 14px; top: 15px; width: 14px; height: 14px; fill: none; stroke: var(--c-ink); stroke-width: 1.1; pointer-events: none; }
/* the series rows — one consecutive list at the sheet's own inset, 11/14 as
   Title/XXS in Figma 1-1205. The family accordions that used to wrap them
   (.grp / .grp__head / .grp__body) are gone. */
.opt--series { font-size: 11px; line-height: 14px; }
.opt[hidden] { display: none; } /* .opt is a flex row, so [hidden] needs saying */
.srch-empty { padding: 8px var(--sheet-pad) 16px; font-size: 11px; font-weight: 300; color: var(--c-ink-soft); }

/* ---- footer — sticky, results count in the CTA (Figma note 1-1773) ---- */
.drawer__foot {
  flex: none;
  padding: 20px var(--sheet-pad);
  display: flex; align-items: center; gap: 16px;
  border-top: 1px solid var(--c-edge);
  background: #fff;
}
/* only appears once at least one filter is set; clears every facet at once */
.drawer__clear {
  flex: none;
  font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  text-decoration: underline; text-underline-offset: 3px;
  transition: opacity .2s;
}
.drawer__clear:hover { opacity: .55; }
.drawer__clear[hidden] { display: none; }
.drawer__cta {
  flex: 1; height: 44px;
  background: var(--c-ink); color: #fff;
  font-size: 14px; letter-spacing: .04em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .2s;
}
.drawer__cta:hover { opacity: .85; }

/* ============================================================
   RESPONSIVE — tablet step + mobile designs (931-14018 etc.)
   ============================================================ */
@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 760px) {
  :root { --row-gap: 40px; }

  /* header — 50px bar: logo · suche · account · bag · burger */
  .nav { padding: 12px 16px; gap: 16px; }
  .logo__img { width: 100px; height: 13px; }
  .nav__links { display: none; }
  .nav__right { gap: 16px; }
  .nav__icons { gap: 16px; }
  .nav__icons .icon { width: 16px; height: 16px; }
  .nav__icons button[aria-label="Wishlist"] { display: none; }
  .burger { display: inline-flex; }
  .search { height: 26px; padding: 0 12px 0 8px; }
  .search svg { width: 14px; height: 14px; }
  .search input { width: 60px; }

  .breadcrumb { font-size: 10px; letter-spacing: .04em; padding: 8px 16px 12px; gap: 8px; }

  /* hero — larger banner title on mobile, left aligned */
  .hero { height: 300px; }
  .hero h1 { font-size: 15px; padding: 0 16px; }

  /* results bar — title left (wraps under itself), "Sort & Filter +" right,
     both aligned along the bottom edge */
  /* mobile keeps the shared bottom edge — the title wraps to two or three
     lines here and "Sort & Filter +" belongs at the foot of that block,
     not centred against it */
  .results-row { padding: 20px 16px 16px; align-items: flex-end; gap: 10px; }
  .results-title { flex: 1; font-size: 12px; line-height: 16px; }
  .results-title .count { font-size: 10px; }
  .filters-mobile { line-height: 16px; }
  .filters, .filters-single { display: none !important; }
  .filters-mobile { display: inline-flex; }

  /* grid — 2 columns, edge to edge: no side padding, and 12px between the
     cards (the desktop 24px is too wide once there are only two columns) */
  .grid {
    grid-template-columns: repeat(2, 1fr) !important;
    margin-bottom: 80px;
    column-gap: 12px;
    padding: 0;
  }

  /* card info — the 4px insets stay: with the grid flush to the viewport
     there is no page padding left to hold the text off the edge */
  .card__info { padding: 10px 4px 0; }
  .card__cat { font-size: 11px; line-height: 16px; }
  .card__pr { margin-top: 2px; font-size: 10px; }
  /* .card__sale inherits the regular price size (10px here);
     one step tighter on the narrow cards — every gap on the line follows */
  .mem { --mem-gap: 6px; }
  .cvar__label { margin-top: 0; font-size: 10px; }

  /* the heart sits closer to the corner on small cards */
  .wish { top: 9px; right: 10px; width: 20px; height: 20px; }
  .wish svg { width: 20px; height: 20px; }

  /* sales banner — smaller pink badge on the narrow cards */
  .sale-flag { font-size: 11px; line-height: 16px; padding: 2px 6px 0; left: 8px; bottom: 8px; }

  /* colour panel — fit the narrow cards; the 4px left inset lines the
     swatches up with the card text now that the grid is flush */
  .panel { flex-wrap: wrap; gap: 4px; padding: 8px 4px; overflow: hidden; }
  .thumb img { width: 32px; height: 32px; }

  /* gallery — swipe only, no chevrons */
  .gal-nav { display: none; }

  /* editorials — full row on mobile (Figma 931-14018 / 931-19249);
     no zoom on the first tile, so its padding matches the others */
  .ed--row2 img { transform: none; }
  .ed--row2, .ed--tall, .ed--last {
    grid-column: 1 / -1 !important; grid-row: auto;
    height: auto !important;
    aspect-ratio: 375 / 247;
  }
  .mood-cta { left: 16px; bottom: 16px; padding: 8px; font-size: 12px; line-height: 16px; }

  /* ---- FILTER BOTTOM SHEET (Figma 21-5889 "FILTER – MOBILE") ----
     the panel stops sliding in from the right and rises from the bottom
     instead, stopping 30px short of the top so the grid stays visible
     behind it. Denser Figma rhythm: 56px heads, 48px option rows. */
  .drawer {
    --sheet-pad: 20px;
    --head-h: 56px;
    --row-h: 48px;
    top: auto; left: 0; right: 0; bottom: 0;
    width: 100%; max-width: none;
    height: calc(100% - 30px);
    height: calc(100dvh - 30px);
    transform: translateY(100%);
  }
  body.drawer-open .drawer { transform: translateY(0); }
  /* while a finger is on the grab bar the sheet tracks it 1:1 */
  .drawer.is-dragging { transition: none; }

  /* grab bar — sits over the top of the header; the header is the whole
     drag surface, so a swipe down anywhere on it dismisses the sheet
     (Figma note 1-1788: close by swiping down or with the ✕) */
  .drawer__grab {
    display: block; position: absolute; top: 8px; left: 50%;
    width: 40px; height: 2px; margin-left: -20px;
    background: #B3B3B3;
  }
  .drawer__head { touch-action: none; }

  /* the page underneath must not scroll while the sheet is up, and the
     prototype chrome would otherwise sit on top of the footer.
     Freezing it with position:fixed (JS supplies the negative top) keeps
     the grid exactly where it was — plain overflow:hidden would snap the
     page back to the top behind the sheet. */
  body.drawer-open { position: fixed; left: 0; right: 0; overflow: hidden; }
  body.drawer-open .dash, body.drawer-open .dash-toggle { display: none; }

}

.dash-toggle {

.dash {

  width: 272px; max-height: calc(100vh - 120px); overflow-y: auto;

.dash__label {

@media (max-width: 760px) {

  .dash { left: 12px; right: 12px; width: auto; bottom: 64px; max-height: 55vh; }

<script>
/* ============================================================
   DATA — products from Figma 937-27178 (Blush & Burgundy),
   colour swatches from /Colour Swatches (black · red · mauve)
   ============================================================ */
/* colour swatches — new pngs from /Colour Swatches (added today) */
const SWATCHES = [
  { name: 'Black',    sw: './Assets/plp/swatch-black.png',    photo: './Assets/plp/products/prod07.jpg' },
  { name: 'Burgundy', sw: './Assets/plp/swatch-burgundy.png', photo: './Assets/plp/products/prod08.jpg' },
  { name: 'Red',      sw: './Assets/plp/swatch-red.png',      photo: './Assets/plp/products/prod09.jpg' },
  { name: 'Pink',     sw: './Assets/plp/swatch-pink.png',     photo: './Assets/plp/products/prod10.jpg' },
  { name: 'Teal',     sw: './Assets/plp/swatch-teal.png',     photo: './Assets/plp/products/prod11.jpg' },
];

const P = n => `./Assets/plp/card${n}.jpg`;
/* `sale` and `mem` are mutually exclusive: member pricing is only granted on
   products that are NOT marked down, so a card carries either a reduced price
   (struck original + SALE badge) or a member price (plain price + member rate,
   no badge) — never both. `mem` is 10% off `pr`. */
const PRODUCTS = [
  { cat: 'LACE BALCONETTE BRA',       pr: '£59.95', colors: 4, ph: P(6), mem: '£53.95' },
  { cat: 'PADDED UNDERWIRE BRA',      pr: '£50.95', colors: 4, ph: P(2) },
  { cat: 'SEAMLESS T-SHIRT BRA',      pr: '£38.50', colors: 3, ph: P(3) },
  { cat: 'PLUNGE LACE BRA',           pr: '£59.95', colors: 4, ph: P(5), sale: '£47.95' },
  { cat: 'WIRELESS COMFORT BRA',      pr: '£29.95', colors: 3, ph: P(1) },
  /* dark red — sits right of the peony interruptor */
  { cat: 'STRAPLESS PUSH-UP BRA',     pr: '£52.00', colors: 4, ph: P(4) },
  { cat: 'DEMI CUP SATIN BRA',        pr: '£55.00', colors: 3, ph: P(3), mem: '£49.50' },
  { cat: 'SPORTS PERFORMANCE BRA',    pr: '£34.95', colors: 4, ph: P(2) },
  { cat: 'FULL COVERAGE BRA',         pr: '£32.00', colors: 3, ph: P(6) },
  { cat: 'BRALETTE TRIANGLE',         pr: '£24.95', colors: 4, ph: P(5), sale: '£17.95' },
  /* two bright pink bras — sit left of the tulle interruptor */
  { cat: 'HALTER NECK BRA',           pr: '£42.50', colors: 4, ph: P(1) },
  { cat: 'EMBROIDERED UNDERWIRE BRA', pr: '£58.00', colors: 3, ph: P(3) },
  { cat: 'CONVERTIBLE MULTI-WAY BRA', pr: '£47.00', colors: 4, ph: P(2), mem: '£42.30' },
  { cat: 'LONGLINE LACE BRA',         pr: '£62.00', colors: 3, ph: P(3) },
  { cat: 'MINIMIZER BRA',             pr: '£39.95', colors: 4, ph: P(6) },
  { cat: 'NURSING SUPPORT BRA',       pr: '£36.00', colors: 3, ph: P(1), sale: '£25.00' },
  { cat: 'RACERBACK SPORTS BRA',      pr: '£28.50', colors: 4, ph: P(5) },
  { cat: 'PADDED UNDERWIRE BRA',      pr: '£59.95', colors: 3, ph: P(4) },
  { cat: 'SOFT LACE BRALETTE',        pr: '£27.95', colors: 4, ph: P(2), mem: '£25.15' },
  { cat: 'UNWIRED SPACER BRA',        pr: '£44.95', colors: 3, ph: P(6) },
  { cat: 'HIGH APEX LACE BRA',        pr: '£49.95', colors: 4, ph: P(1) },
  { cat: 'SATIN TRIM BRA',            pr: '£41.00', colors: 3, ph: P(3) },
];

/* the Triumph crown, inlined from Assets/plp/triumph-crown.svg (Amelie's
   export) so it can take currentColor and follow the member-price colour */
const CROWN = '<svg class="crown" viewBox="0 0 23 20" aria-hidden="true"><path d="M22.3766 5.22624L15.5607 16.0549L15.7389 0L15.6142 6.93399e-09L11.2574 15.8444L6.89607 4.92073e-07L6.77135 4.99014e-07L6.94954 16.0549L0.133636 5.22624H0L4.41919 19.7137L8.77602 16.7804L13.7342 16.7804L18.091 19.7137L22.5103 5.22624H22.3766Z"/></svg>';

/* new Blush & Burgundy product photos — from
   /FOR NEVER DONE BLUSH AND BURGUNDY/Colors combined (copied in) */
const PROD = n => `./Assets/plp/products/prod${String(n).padStart(2, '0')}.jpg`;
const PROD_PHOTOS = Array.from({ length: 23 }, (_, i) => PROD(i + 1));
/* photos hand-ordered: blush (B) and burgundy (Bu) alternate so a blush
   product always sits beside a burgundy one, AND look-alike shots are
   spread apart — the mauve-on-dark trio (5/6/7/20) and the redheads
   (3/13 · 10/14) never land next to each other. prod22 (2nd plaid
   redhead, a near-dupe of 10) is dropped for prod23 (burgundy dress). */
const PHOTO_ORDER = [1, 2, 5, 8, 6, 10, 16, 9, 4, 11, 7, 14, 20, 15, 13, 17, 3, 18, 19, 21, 12, 23];
PRODUCTS.forEach((p, i) => { p.ph = PROD(PHOTO_ORDER[i % PHOTO_ORDER.length]); });

/* ============================================================
   RENDER CARDS
   ============================================================ */
const grid = document.getElementById('grid');

/* alternate product photos for the hover gallery (4 per card) */
const GALLERY_POOL = PROD_PHOTOS;

PRODUCTS.forEach((p, i) => {
  /* 4 hover photos: the card's own + 3 rotating alternates */
  const others = GALLERY_POOL.filter(src => src !== p.ph);
  const gallery = [p.ph, others[i % others.length], others[(i + 2) % others.length], others[(i + 4) % others.length]];

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.gallery = gallery.join('|');

  /* panel thumbs: the worn colour (product photo crop) + fabric swatches */
  const swatchThumbs = SWATCHES.slice(0, p.colors - 1).map((s, j) => `
    <button class="thumb" data-photo="${s.photo}" data-idx="${j + 1}" data-sel="false" aria-label="${s.name}" title="${s.name}">
      <img src="${s.sw}" alt="${s.name}" loading="lazy" />
    </button>`).join('');

  card.innerHTML = `
    <div class="card__img">
      <img class="ph ph--base" src="${p.ph}" alt="${p.cat}" />
      <img class="ph ph--variant" src="${p.ph}" alt="" aria-hidden="true" />
      <img class="ph ph--hover" src="${gallery[1]}" alt="" aria-hidden="true" />
      ${p.sale ? '<span class="sale-flag">SALE</span>' : ''}

const mkTile = (cls, src) => {
  const t = document.createElement('div');

};

/* CONTENT TYPES media — a muted looping video replaces the second mood
   image (tall slot), the screenshot + "Discover this product" CTA
   replace the third (last slot); CSS scopes both to the "content"
   view, applyView() swaps the image source back and forth */
const moodVideo = document.createElement('video');
moodVideo.src = './Assets/plp/hero.mp4'; /* same clip as the hero banner */
moodVideo.muted = true;
moodVideo.loop = true;
moodVideo.playsInline = true;

const moodCta = document.createElement('button');
moodCta.className = 'mood-cta';

const ED_LAST_SRC = './Assets/plp/ed-hydrangea.jpg';

function applyView(v) {
  const content = v === 'content';

  if (content) moodVideo.play().catch(() => {});
  else moodVideo.pause();

const cards = []; /* filled below, before the first placeTiles() */

/* editorial interruptor slots — before cards 5 (row 2), 12 (tall), 20 (last) */
function placeTiles() {
  grid.insertBefore(edRow2, cards[5] || null);
  grid.insertBefore(edTall, cards[12] || null);
  grid.insertBefore(edLast, cards[20] || null);
}

/* ============================================================
   "TRIUMPH LIVE" PHOTOS — tile images scraped from
   https://uk.triumph.com/bras (one per product, page order);
   swapped in while the Images option is on "Triumph live"
   ============================================================ */
const LIVE_PHOTOS = Array.from({ length: 22 }, (_, i) =>
  `./Assets/plp/live/live${String(i + 1).padStart(2, '0')}.webp`);

function applyPhotos(live) {
  cards.forEach((card, i) => {
    if (!card.dataset.galleryHome) card.dataset.galleryHome = card.dataset.gallery;
    const n = LIVE_PHOTOS.length;
    const gal = live
      ? [LIVE_PHOTOS[i % n], LIVE_PHOTOS[(i + 5) % n], LIVE_PHOTOS[(i + 11) % n], LIVE_PHOTOS[(i + 17) % n]]
      : card.dataset.galleryHome.split('|');
    card.dataset.gallery = gal.join('|');
    card.querySelector('.ph--base').src = gal[0];
    card.querySelector('.ph--variant').src = gal[0];
    const cur = card.querySelector('.thumb--current');
    cur.dataset.photo = gal[0];
    cur.querySelector('img').src = gal[0];
    /* colour swatches preview other live shots instead of the Figma photos */
    card.querySelectorAll('.panel .thumb:not(.thumb--current)').forEach((t, j) => {
      if (!t.dataset.photoHome) t.dataset.photoHome = t.dataset.photo;
      t.dataset.photo = live ? gal[(j + 1) % gal.length] : t.dataset.photoHome;
    });
  });
}

/* ============================================================
   "SHOW PRODUCTS ON MODEL" — the toggle at the top of the filter
   sheet (Figma 1-2313). There is no packshot set in this prototype,
   so the off state falls back to the garment-led crops already in
   Assets/plp/products — no faces, the product fills the frame.
   Swap PACKSHOTS for real packshots once they exist.
   ============================================================ */
const PACKSHOTS = [1, 2, 14, 18, 11, 22, 17, 8, 5].map(PROD);

function applyModelView(on) {
  cards.forEach((card, i) => {
    const src = on ? card.dataset.gallery.split('|')[0] : PACKSHOTS[i % PACKSHOTS.length];

   INTERACTIONS
   ============================================================ */
const body = document.body;
cards.push(...document.querySelectorAll('.card'));
placeTiles();

/* hero video loops forever;
   the title fades in a second after playback starts */
const hero = document.querySelector('.hero');
const heroVideo = hero.querySelector('video');
const showHeroTitle = () => hero.classList.add('is-ended');
heroVideo.addEventListener('playing', () => setTimeout(showHeroTitle, 1000), { once: true });
heroVideo.addEventListener('error', showHeroTitle);
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) showHeroTitle();

/* keep the sticky results bar flush below the nav, whatever its real height */
const setHeaderH = () =>
  document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
setHeaderH();
window.addEventListener('resize', setHeaderH);

/* editorial tiles are trimmed so their images end level with the
   neighbouring photos (row2/last) or the second photo row (tall) */
function alignTiles() {
  const mobile = window.innerWidth <= 760;
  if (mobile) { [edRow2, edTall, edLast].forEach(t => t.style.height = ''); return; }
  const ref = cards.find(c => c.offsetParent) || cards[0];
  const photoH = ref.querySelector('.card__img').offsetHeight;
  [edRow2, edTall, edLast].forEach(t => t.style.height = photoH + 'px');
}
window.addEventListener('resize', alignTiles);
window.addEventListener('load', alignTiles);

/* ============================================================
   SCROLL REVEAL — one-shot blurred rise; everything entering the
   viewport animates together (no per-card stagger, so rows stay
   top-aligned during the fade-in)
   ============================================================ */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  [...grid.children].forEach(c => c.classList.add('is-visible'));
} else {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('is-visible');
      io.unobserve(en.target);
    });
  }, { threshold: .2, rootMargin: '0px 0px -10% 0px' });
  [...grid.children].forEach(c => io.observe(c));
}

function closeAll(except) {
  cards.forEach(c => { if (c !== except) c.classList.remove('is-open'); });
}

function swapImage(card, src) {
  const overlay = card.querySelector('.ph--variant');
  if (!src) { overlay.classList.remove('is-on'); return; }
  overlay.src = src;
  if (overlay.complete) overlay.classList.add('is-on');
  else overlay.onload = () => overlay.classList.add('is-on');
}

cards.forEach(card => {
  /* clicking the product (photo or title) opens the PDP;
     colour label / panel / gallery / heart keep their own behaviour */
  card.addEventListener('click', e => {
    if (e.target.closest('.thumb, .cvar__label, .panel, .gal-nav, .wish')) return;
    window.location.href = './pdp.html';
  });

  /* hover gallery — entering the photo crossfades a second shot in,
     chevrons page through all 4; leaving restores the base photo.
     The crossfade runs *through* the zoom, not instead of it: the scale
     is on .ph (every layer), so the incoming shot is mid-zoom when it
     lands and the movement never stops (see .card__img .ph).
     (the photo set is read per call — versions may swap it) */
  const hoverImg = card.querySelector('.ph--hover');
  const imgWrap = card.querySelector('.card__img');
  let galIdx = 0;
  function showGal(i) {
    const gallery = card.dataset.gallery.split('|');
    galIdx = (i + gallery.length) % gallery.length;
    if (galIdx === 0) { hoverImg.classList.remove('is-on'); return; }
    hoverImg.src = gallery[galIdx];
    if (hoverImg.complete) hoverImg.classList.add('is-on');
    else hoverImg.onload = () => hoverImg.classList.add('is-on');
  }
  card._resetGallery = () => showGal(0);
  /* hover gallery is pointer-only — a tap on touch devices must not swap the photo */
  const isTouch = window.matchMedia('(hover: none)').matches;
  if (!isTouch) {
    imgWrap.addEventListener('mouseenter', () => showGal(1));
    imgWrap.addEventListener('mouseleave', () => showGal(0));
  }
  card.querySelector('.gal-nav--prev').addEventListener('click', e => { e.stopPropagation(); showGal(galIdx - 1); });
  card.querySelector('.gal-nav--next').addEventListener('click', e => { e.stopPropagation(); showGal(galIdx + 1); });

  /* touch — swipe left/right pages through the gallery */
  let tX = 0, tY = 0;
  imgWrap.addEventListener('touchstart', e => {
    tX = e.touches[0].clientX; tY = e.touches[0].clientY;
  }, { passive: true });
  imgWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tX;
    const dy = e.changedTouches[0].clientY - tY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) showGal(galIdx + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* wishlist heart */
  const wish = card.querySelector('.wish');
  wish.addEventListener('click', e => {
    e.stopPropagation();
    wish.dataset.on = wish.dataset.on === 'true' ? 'false' : 'true';
  });

  /* colour panel — desktop: hovering the label reveals it, leaving the
     info area closes it · touch: tap toggles, tap on the panel
     background closes */
  const cvarLabel = card.querySelector('.cvar__label');
  if (isTouch) {
    cvarLabel.addEventListener('click', e => {
      e.stopPropagation();
      const open = card.classList.contains('is-open');
      closeAll(card);
      card.classList.toggle('is-open', !open);
    });
  } else {
    cvarLabel.addEventListener('mouseenter', () => { closeAll(card); card.classList.add('is-open'); });
  }
  if (!isTouch) {
    card.querySelector('.card__info').addEventListener('mouseleave', () => card.classList.remove('is-open'));
  }
  card.querySelector('.panel').addEventListener('click', e => {
    e.stopPropagation();
    if (!e.target.closest('.thumb')) card.classList.remove('is-open');
  });

  /* swatch thumbnails — click selects + swaps the photo */
  card.querySelectorAll('.thumb').forEach(th => {
    th.addEventListener('click', e => {
      e.stopPropagation();
      card.querySelectorAll('.thumb').forEach(t => t.dataset.sel = String(t === th));
      /* the current-colour thumb restores the card's own photo */
      swapImage(card, th.dataset.idx === '0' ? null : th.dataset.photo);
    });
  });
});

/* click outside closes open panels */
document.addEventListener('click', e => {
  if (!e.target.closest('.card')) closeAll();
});

const TOTAL_RESULTS = 36;

/* Series is two levels deep — a family, then its lines. "All in <family>"
   is its own option that clears the individual lines; whether it should
   instead tick every child is still open (Figma note 1-1782).
   A family with no lines of its own is a plain selectable row: Figma
   1-1272 shows that case as "Aura Spotlight (2)" — family-level indent,
   no chevron, ticks like any other option.
   This is deliberately the full catalogue length rather than a token five
   families. The facet has to hold a market that carries everything, which
   is what forces the desktop dropdown to scroll its series list inside its
   own scroll (see .dd-series). */
const SERIES_SRC = [
  { n: 'Airy Sensation', lines: [['Airy Sensation W01', 3], ['Airy Sensation Padded', 2]] },
  { n: 'Amourette', lines: [['Amourette Charm', 4], ['Amourette Spotlight', 5], ['Amourette Graphic', 3], ['Amourette 300', 6]] },

  { n: 'Body Make-Up', lines: [['Body Make-Up Soft Touch', 5], ['Body Make-Up Essentials', 4], ['Body Make-Up Blossom', 3]] },
  { n: 'Comfort', lines: [['Comfort Minimizer', 6], ['Comfort Cotton', 5]] },
  { n: 'Doreen', lines: [['Doreen Original', 6], ['Doreen Cotton', 3]] },
  { n: 'Essential Minimizer', lines: [['Essential Minimizer Lace', 4]] },

  { n: 'Florale', lines: [['Florale Chiffon', 4], ['Florale Peony', 3], ['Florale W01', 2]] },
  { n: 'Katia', lines: [['Katia Basics', 5], ['Katia Cotton', 4]] },
  { n: 'Lovely Micro', c: 4 },
  { n: 'Luxurious Sensation', c: 3 },
  { n: 'Magic Wire', lines: [['Magic Wire Lite', 4], ['Magic Wire Padded', 3]] },
  { n: 'Maximizer', lines: [['Maximizer 819', 3]] },
  { n: 'Modern Finesse', c: 6 },
  { n: 'Perfectly Soft', c: 4 },
  { n: 'Sculpting Sensation', c: 5 },
  { n: 'Shape Smart', lines: [['Shape Smart Padded', 4], ['Shape Smart Bodysuit', 2]] },

];

/* a family's count is always the sum of its lines, so the CTA arithmetic
   can never contradict the number printed on the head */
const SERIES = SERIES_SRC.map(g => {
  if (!g.lines) return { n: g.n, c: g.c };
  const items = g.lines.map(([n, c]) => ({ n, c }));
  const c = items.reduce((s, o) => s + o.c, 0);
  return { n: g.n, c, items: [{ n: `All in ${g.n}`, c, all: true }, ...items] };
});

/* ---- the one series list both surfaces draw ----
   Every product line, alphabetical, in a single consecutive list: the
   desktop dropdown and the mobile sheet share it so they can never disagree
   about what the catalogue contains. The family accordions the design showed
   are gone from both (2026-08-31) — a second level of expand-and-collapse
   cost a tap per selection and hid the row you were aiming at — and the
   "All in <family>" rows went with them, since they only mean something
   inside a hierarchy.
   SERIES_ROWS keeps the pre-filter order because ddState and the drawer both
   index into it; SERIES_FLAT is what gets drawn. */
const SERIES_ROWS = [];
SERIES.forEach(g => {
  const push = o => SERIES_ROWS.push({ name: o.n, count: o.c, all: !!o.all });
  g.items ? g.items.forEach(push) : push(g);
});
const SERIES_FLAT = SERIES_ROWS
  .map((o, i) => ({ n: o.name, c: o.count, i, all: o.all }))
  .filter(o => !o.all)
  .sort((a, b) => a.n.localeCompare(b.n));
