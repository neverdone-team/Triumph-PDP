          <div class="pr__track"></div><div class="pr__fill"></div>
          <input type="range" class="pr__r pr__r--lo" min="${f.min}" max="${f.max}" value="${f.min}" aria-label="Minimum price" />
          <input type="range" class="pr__r pr__r--hi" min="${f.min}" max="${f.max}" value="${f.max}" aria-label="Maximum price" />
        </div>
      </div>
      <div class="pr-b">${f.bands.map(b => optRow(b, false)).join('')}</div>`;
  } else if (f.type === 'series') {
    /* one consecutive list, same rows as the desktop dropdown (Figma 1-1205) */
    inner = `
      <div class="srch">
        <input type="search" placeholder="Search series" aria-label="Search series" />
        <svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.6"/><path d="M9.4 9.4 13 13"/></svg>
      </div>
      ${SERIES_FLAT.map(o => optRow({ n: o.n, c: o.c }, false, ' opt--series')).join('')}
      <div class="srch-empty" hidden>No series match that search.</div>`;
  }

  const facet = document.createElement('div');
  facet.className = 'facet facet--' + f.key;
  facet.dataset.i = i;
  if (f.open) facet.classList.add('is-open');
  facet.innerHTML = `
    <button class="facet__head">
      <span class="facet__txt">
        <span class="facet__lb">${f.label}<i class="facet__n"></i></span>
        ${f.type === 'radio' ? '<span class="facet__val"></span>' : ''}
      </span>
      ${CHEV}
    </button>
    <div class="facet__body"><div class="facet__inner">${inner}</div></div>`;

  facet.querySelector('.facet__head').addEventListener('click', () => {
    const open = facet.classList.contains('is-open');
    if (!isSheet()) facetEls.forEach(x => x.classList.remove('is-open'));
    facet.classList.toggle('is-open', !open);
  });

  /* option rows and chips — Sort by is a radio, everything else toggles */
  facet.addEventListener('click', e => {
    const btn = e.target.closest('.opt, .chips button, .col');
    if (!btn || !facet.contains(btn)) return;
    const wasOn = btn.dataset.on === 'true';
    if (f.type === 'radio') {
      facet.querySelectorAll('.opt').forEach(b => b.dataset.on = 'false');
      btn.dataset.on = 'true';
    } else if (f.type === 'price') {
      /* option B is one band at a time */
      facet.querySelectorAll('.pr-b .opt').forEach(b => b.dataset.on = 'false');
      btn.dataset.on = String(!wasOn);
    } else {
      btn.dataset.on = String(!wasOn);
    }
    sync();
  });

  /* series: live search straight over the one list — no accordions left to
     open, so a match is simply shown and everything else hidden */
  if (f.type === 'series') {
    const input = facet.querySelector('.srch input');
    const empty = facet.querySelector('.srch-empty');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      let hits = 0;
      facet.querySelectorAll('.opt--series').forEach(o => {
        const hit = !q || o.textContent.toLowerCase().includes(q);
        o.hidden = !hit;
        if (hit) hits++;
      });
      empty.hidden = hits > 0;
    });
  }

  /* price option A: two overlapping ranges, kept in order, mirrored
     into the min/max fields (and typing in a field moves the thumb) */
  if (f.type === 'price') {
    const rLo = facet.querySelector('.pr__r--lo'), rHi = facet.querySelector('.pr__r--hi');
    const inLo = facet.querySelector('.pr__in--lo'), inHi = facet.querySelector('.pr__in--hi');
    const fill = facet.querySelector('.pr__fill');
    const paint = () => {
      const lo = +rLo.value, hi = +rHi.value, span = f.max - f.min;
      fill.style.left  = `calc(8px + ${(lo - f.min) / span} * (100% - 16px))`;
      fill.style.right = `calc(8px + ${(f.max - hi) / span} * (100% - 16px))`;
      inLo.value = '£' + lo; inHi.value = '£' + hi;
    };
    rLo.addEventListener('input', () => { if (+rLo.value > +rHi.value) rLo.value = rHi.value; paint(); sync(); });
    rHi.addEventListener('input', () => { if (+rHi.value < +rLo.value) rHi.value = rLo.value; paint(); sync(); });
    const typed = (input, range, other, isLo) => {
      const v = parseInt(input.value.replace(/[^\d]/g, ''), 10);
      if (!isNaN(v)) {
        range.value = Math.min(f.max, Math.max(f.min, v));
        if (isLo && +range.value > +other.value) other.value = range.value;
        if (!isLo && +range.value < +other.value) other.value = range.value;
      }
      paint(); sync();
    };
    inLo.addEventListener('change', () => typed(inLo, rLo, rHi, true));
    inHi.addEventListener('change', () => typed(inHi, rHi, rLo, false));
    facet._price = { rLo, rHi, paint };
    paint();
  }

  facetEls.push(facet);
  facetsEl.appendChild(facet);
});

/* ============================================================
   PANEL STATE — per-facet counts, the header count, and the CTA
   ============================================================ */
const drawerN = document.getElementById('drawerN');
const clearBtn = document.querySelector('.drawer__clear');
const ctaBtn = document.querySelector('.drawer__cta');

/* price is "set" only once the range is actually narrowed; its count is
   the sum of the bands the range still covers */
function priceState() {
  const f = FACETS.find(x => x.key === 'price');
  const facet = facetEls[FACETS.indexOf(f)];
  if (document.body.dataset.price === 'b') {
    const on = facet.querySelector('.pr-b .opt[data-on="true"]');
    return on ? { n: 1, c: +on.dataset.c } : { n: 0 };
  }
  const lo = +facet._price.rLo.value, hi = +facet._price.rHi.value;
  if (lo === f.min && hi === f.max) return { n: 0 };
  const c = f.bands.filter(b => b.lo < hi && b.hi > lo).reduce((s, b) => s + b.c, 0);
  return { n: 1, c: Math.max(1, c) };
}

/* Within one facet the choices are alternatives, so their counts add up;
   across facets they narrow each other, so the smallest count wins. Size
   holds two independent grids (underbust AND cup), so each counts alone. */
function facetCounts(el, f) {
  const groups = f.type === 'sizes' ? [...el.querySelectorAll('.chips')] : [el];
  const out = [];
  groups.forEach(g => {
    let sum = 0, any = false;
    g.querySelectorAll('[data-on="true"][data-c]').forEach(b => { sum += +b.dataset.c; any = true; });
    if (any) out.push(Math.min(TOTAL_RESULTS, sum));
  });
  return out;
}

function sync() {
  let total = 0;
  const counts = [];
  FACETS.forEach((f, i) => {
    const el = facetEls[i];
    let n = 0;
    if (f.key === 'sort') {
      const on = el.querySelector('.opt[data-on="true"]');
      el.querySelector('.facet__val').textContent = on ? on.textContent.trim() : '';
    } else if (f.type === 'price') {
      const p = priceState();
      n = p.n;
      if (p.c != null) counts.push(p.c);
    } else {
      n = el.querySelectorAll('[data-on="true"]').length;
      counts.push(...facetCounts(el, f));
    }
    el.querySelector('.facet__n').textContent = n ? ` (${n})` : '';
    total += n;
  });
  drawerN.textContent = total ? `(${total})` : '';
  clearBtn.hidden = !total;
  const results = counts.length ? Math.min(...counts) : TOTAL_RESULTS;
  ctaBtn.textContent = total ? `Show ${results} results` : 'Show results';
}

/* Reset wipes every facet at once; the sort choice is not a filter */
clearBtn.addEventListener('click', () => {
  FACETS.forEach((f, i) => {
    if (f.key === 'sort') return;
    const el = facetEls[i];
    el.querySelectorAll('[data-on="true"]').forEach(b => b.dataset.on = 'false');
    if (f.type === 'price') {
      el._price.rLo.value = f.min; el._price.rHi.value = f.max; el._price.paint();
    }
    if (f.type === 'series') {
      el.querySelector('.srch input').value = '';
      el.querySelectorAll('.opt--series').forEach(o => o.hidden = false);
      el.querySelector('.srch-empty').hidden = true;
    }
  });
  sync();
});

/* ============================================================
   OPEN / CLOSE — the drawer slides in from the right on desktop and
   rises as a bottom sheet on mobile, where it can also be swiped away
   (Figma note 1-1788)
   ============================================================ */
const drawer = document.querySelector('.drawer');

/* freeze the page behind the sheet without losing the reader's place */
let lockY = 0;
function lockPage(on) {
  if (!isSheet()) { document.body.style.top = ''; return; }
  if (on) {
    lockY = window.scrollY;
    document.body.style.top = `-${lockY}px`;
  } else {
    document.body.style.top = '';
    /* the frozen body has no scroll height, so force a reflow first —
       otherwise scrollTo clamps to one viewport and lands near the top */
    void document.body.offsetHeight;
    window.scrollTo(0, lockY);
  }
}

function setDrawer(open) {
  if (open) lockPage(true);
  document.body.classList.toggle('drawer-open', open);
  drawer.setAttribute('aria-hidden', String(!open));
  if (!open) lockPage(false);
}
document.getElementById('drawerTrigger').addEventListener('click', () => setDrawer(true));
document.querySelector('.filters-mobile').addEventListener('click', () => setDrawer(true));
document.querySelector('.drawer__close').addEventListener('click', () => setDrawer(false));
ctaBtn.addEventListener('click', () => setDrawer(false));
document.getElementById('scrim').addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });

/* swipe down on the header (the grab bar sits on it) to dismiss —
   past a third of the sheet, or a quick flick, closes it */
(() => {
  const head = drawer.querySelector('.drawer__head');
  let y0 = 0, t0 = 0, dy = 0, live = false;
  const end = () => {
    if (!live) return;
    live = false;
    drawer.classList.remove('is-dragging');
    drawer.style.transform = '';
    const fast = dy > 40 && (performance.now() - t0) < 300;
    if (dy > drawer.offsetHeight / 3 || fast) setDrawer(false);
  };
  head.addEventListener('pointerdown', e => {
    if (!isSheet() || e.target.closest('.drawer__close')) return;
    live = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    drawer.classList.add('is-dragging');
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!live) return;
    dy = Math.max(0, e.clientY - y0);
    drawer.style.transform = `translateY(${dy}px)`;
  });
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
})();

/* the product view switch — the sheet is where this option really lives,
   so it drives the shared body state rather than a dashboard row */
const modelSwitch = document.getElementById('modelSwitch');
modelSwitch.addEventListener('click', () => {
  setOption('model', modelSwitch.getAttribute('aria-checked') === 'true' ? 'off' : 'on');
});

sync();

/* ============================================================
   FILTER V1 — chip dropdowns (Figma 931-26774) + More dropdown
   ============================================================ */
const DD_ITEMS = {
  size: [], /* filled from SIZE_GRIDS below — underbust then cup */
  colour: [
    { name: 'Red',   c: '#C1003F' }, { name: 'Blue',  c: '#3B82F6' },
    { name: 'Green', c: '#10B981' }, { name: 'Black', c: '#000000' },
    { name: 'White', c: '#FFFFFF' }, { name: 'Pink',  c: '#EC4899' },
    { name: 'Grey',  c: '#6B7280' },
  ],
  series: [], /* filled from SERIES_ROWS below — the whole catalogue */
  fabric: ['Lace', 'Satin', 'Mesh', 'Cotton'],
  price: ['Under £30', '£30 – £50', 'Over £50'],
  standards: ['OEKO-TEX Standard 100', 'Recycled materials', 'Organic cotton'],
  sort: ['Newest', 'Price (low – high)', 'Price (high – low)', 'Bestsellers'],
};

/* Size is a grid, not a list (Figma 1-1275 "Size grid"): two labelled 5-across
   blocks, underbust then cup. Both read from the drawer's own size facet so
   there is one set of sizes in the file, and both flatten into DD_ITEMS.size
   so ticking, Reset and the chip count work like any other facet. */
const SIZE_GRIDS = FACETS.find(f => f.key === 'size').grids.map(g => ({
  label: g.label,
  items: g.items.map(([s]) => ({ s, i: DD_ITEMS.size.push(s) - 1 })),
}));

/* ddState indexes into SERIES_ROWS (built with the facet data further up), so
   ticking and Reset behave exactly like any other facet */
DD_ITEMS.series = SERIES_ROWS;

const ddState = { sort: new Set([0]) }; /* per facet: selected indices */

const resultsRow = document.querySelector('.results-row');
const dropdown = document.createElement('div');
dropdown.className = 'dropdown';
resultsRow.appendChild(dropdown);
let ddChip = null;

/* ---- panel geometry ----
   Sized from the space actually available beside the chip, not from the
   viewport, and flipped above the chip when there is more room there — so
   the panel can never overflow the fold. The earlier version took
   max-height: min(480px, 60vh) and always opened downward, which left
   273-344px of it below the fold whenever the chip sat low in the window. */
const DD_GAP = 8;      /* chip → panel */
const DD_MARGIN = 16;  /* panel → viewport edge */
/* per-facet panel width — the size grid needs 367px for its 5 columns
   (Figma 1-1275), everything else is the standard 240px chip dropdown */
const DD_WIDTH = { size: 367 };
const ddWidth = () => DD_WIDTH[dropdown.dataset.facet] || 240;

const ddSpace = chip => {
  const r = chip.getBoundingClientRect();
  return {
    below: innerHeight - r.bottom - DD_GAP - DD_MARGIN,
    above: r.top - DD_GAP - DD_MARGIN,
  };
};

function anchorDropdown(chip) {
  const rowRect = resultsRow.getBoundingClientRect();
  const r = chip.getBoundingClientRect();
  dropdown.style.left = Math.min(r.left - rowRect.left, resultsRow.clientWidth - ddWidth() - 24) + 'px';

  const { below, above } = ddSpace(chip);
  /* only flip when it buys real room — a flip for 20px is just a jump */
  const flip = above > below + 80;
  const space = Math.max(120, flip ? above : below);
  if (flip) {
    dropdown.style.top = 'auto';
    dropdown.style.bottom = (rowRect.bottom - r.top + DD_GAP) + 'px';
  } else {
    dropdown.style.bottom = 'auto';
    dropdown.style.top = (r.bottom - rowRect.top + DD_GAP) + 'px';
  }
  dropdown.style.maxHeight = Math.min(space, 560) + 'px';
  dropdown.dataset.flip = String(flip);
  dropdown.classList.add('is-open');
  ddChip = chip;
}

/* option rows for one facet — shared by the chip dropdowns and the
   "More" accordion */
function optionRowsHTML(key) {
  const sel = ddState[key] || (ddState[key] = new Set());
  return DD_ITEMS[key].map((it, i) => {
    const name = typeof it === 'string' ? it : it.name;
    /* only the colour facet carries a swatch — an object item without a
       colour (a series row) must not get an empty one */
    const sw = typeof it === 'string' || !it.c ? '' : `<span class="sw" style="background:${it.c}"></span>`;
    const c = typeof it === 'string' || it.count == null ? '' : ` <span class="cnt">(${it.count})</span>`;
    return `<button class="dropdown__row" data-key="${key}" data-i="${i}" data-on="${sel.has(i)}">${sw}<span class="lbl">${name}${c}</span>
      <svg class="tick" viewBox="0 0 16 16"><path d="M2.5 8.5 6.5 12.5 13.5 4"/></svg></button>`;
  }).join('');
}

/* ---- Series (Figma 1-1272) ----
   A search pinned above one flat alphabetical list of every product line.
   The family accordions the design showed were dropped on 2026-08-31: a
   second level of expand-and-collapse inside a 240px panel cost a click per
   selection and hid the thing you were looking for, and with a search over
   the whole catalogue the hierarchy earned nothing. "All in <family>" went
   with them — it only means something inside a hierarchy. */
/* ---- Size (Figma 1-1275 "Size grid") ----
   Not a list of made-up 70A/75B combinations but the real two-axis picker:
   underbust and cup chosen separately, 5 across, the way the drawer and the
   PDP already ask for a size. The panel widens to 367px for it — a 5-column
   grid of 60px chips cannot live in 240px. No counts on the chips: the
   design deliberately keeps numbers off the size grid. */
function sizeGridHTML() {
  const sel = ddState.size || (ddState.size = new Set());
  return `<div class="dd-grids">` + SIZE_GRIDS.map(g => `
    <div class="dd-grid-block">
      <div class="dd-grid__lb">${g.label}</div>
      <div class="dd-grid">${g.items.map(o =>
        `<button data-key="size" data-i="${o.i}" data-on="${sel.has(o.i)}">${o.s}</button>`).join('')}</div>
    </div>`).join('') + `</div>`;
}

function seriesGroupHTML() {
  const sel = ddState.series || (ddState.series = new Set());
  /* Names like "Signature Sheer Minimizer" wrap inside 240px, and the count
     was landing alone on the second line. Glue it to the last word — the
     same trick the results title uses for its "(36)". */
  const label = (n, c) => {
    const cut = n.lastIndexOf(' ');
    const head = cut === -1 ? '' : n.slice(0, cut + 1);
    const tail = cut === -1 ? n : n.slice(cut + 1);
    return `${head}<span class="nw">${tail} <span class="cnt">(${c})</span></span>`;
  };
  const row = o =>
    `<button class="dropdown__row dd-item" data-key="series" data-i="${o.i}"
       data-on="${sel.has(o.i)}">
       <span class="lbl">${label(o.n, o.c)}</span>
       <svg class="tick" viewBox="0 0 16 16"><path d="M2.5 8.5 6.5 12.5 13.5 4"/></svg></button>`;
  const list = SERIES_FLAT.map(row).join('');
  return `
    <div class="dd-srch">
      <input type="search" placeholder="Search series" aria-label="Search series" />
      <svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.6"/><path d="M9.4 9.4 13 13"/></svg>
    </div>
    <div class="dd-series">${list}</div>
    <div class="dd-srch-empty" hidden>No series match that search.</div>`;
}

function bindSeriesGroup() {
  const scroller = dropdown.querySelector('.dd-series');
  if (!scroller) return;
  const input = dropdown.querySelector('.dd-srch input');
  const empty = dropdown.querySelector('.dd-srch-empty');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let hits = 0;
    scroller.querySelectorAll('.dd-item').forEach(item => {
      const hit = !q || item.textContent.toLowerCase().includes(q);
      item.hidden = !hit;
      if (hit) hits++;
    });
    empty.hidden = hits > 0;
    scroller.scrollTop = 0;
  });
}

function bindOptionRows() {
  /* [data-key][data-i] rather than .dropdown__row — the size grid's chips
     carry the same contract without being list rows */
  dropdown.querySelectorAll('[data-key][data-i]').forEach(rowBtn => {
    rowBtn.addEventListener('click', () => {
      const key = rowBtn.dataset.key;
      const sel = ddState[key];
      const i = +rowBtn.dataset.i;
      if (key === 'sort') { /* single choice */
        sel.clear(); sel.add(i);
        dropdown.querySelectorAll('.dropdown__row[data-key="sort"]').forEach(b => b.dataset.on = 'false');
        rowBtn.dataset.on = 'true';
        return;
      }
      sel.has(i) ? sel.delete(i) : sel.add(i);
      rowBtn.dataset.on = String(sel.has(i));
      syncDdFoot();
    });
  });
}

/* the facets the open dropdown covers — what Reset clears and what decides
   whether the foot shows at all */
let ddKeys = [];
const FOOT_HTML = `
  <div class="dropdown__foot" hidden>
    <div class="dropdown__actions"><button class="dd-reset">Reset filters</button></div>
  </div>`;

/* Reset exists only once there is something to reset. Sort is a single
   choice with a default, not a filter — the drawer takes the same view — so
   it never raises the foot. */
function syncDdFoot() {
  const foot = dropdown.querySelector('.dropdown__foot');
  if (foot) {
    foot.hidden = !ddKeys.filter(k => k !== 'sort')
      .reduce((n, k) => n + (ddState[k] ? ddState[k].size : 0), 0);
  }
  /* the chip row shows the same state one level up (Figma 1-1328) */
  syncFilterRow();
}

function bindFoot(keys) {
  ddKeys = keys;
  dropdown.querySelector('.dd-reset').addEventListener('click', () => {
    keys.forEach(k => ddState[k] && ddState[k].clear());
    dropdown.querySelectorAll('[data-key][data-i]').forEach(b => b.dataset.on = 'false');
    /* the series query is part of the facet's state — a Reset that left a
       search term in place would look like it had missed most of the list */
    const srch = dropdown.querySelector('.dd-srch input');
    if (srch) { srch.value = ''; srch.dispatchEvent(new Event('input')); }
    syncDdFoot();
  });
  syncDdFoot();
}

function openDropdown(chip, key = chip.dataset.f) {
  /* no Save: every tick applies immediately, so the dropdown closes by
     clicking away or re-clicking its chip */
  const inner = key === 'size' ? sizeGridHTML() : optionRowsHTML(key);
  dropdown.dataset.facet = key; /* drives the panel width — see DD_WIDTH */
  dropdown.innerHTML = `<div class="dropdown__scroll">${inner}</div>` + FOOT_HTML;
  anchorDropdown(chip);
  bindOptionRows();
  bindFoot([key]);
}
function closeDropdown() {
  dropdown.classList.remove('is-open');
  ddChip = null;
}
/* On a pointer device the chip has already opened on hover by the time the
   click lands, so treating the click as "toggle" closed it again and the chip
   read as dead. A click on an already-open chip is a no-op there; closing is
   the job of clicking away, or of moving the pointer off. */
const HAS_HOVER = window.matchMedia('(hover: hover)').matches;
document.querySelectorAll('.filters--reduced [data-f]').forEach(chip => {
  chip.addEventListener('click', e => {
    e.stopPropagation();
    if (ddChip === chip) { if (!HAS_HOVER) closeDropdown(); return; }
    openDropdown(chip);
  });
});
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown, .filters--reduced')) closeDropdown();
});

/* "More" lists the remaining filters in ONE dropdown; each expands
   its options in place (accordion), no separate view */
/* Series last, matching the sheet's facet order: it is the only group long
   enough to need its own scroll, so anywhere but the end it pushes the other
   groups out of view the moment it opens. */
const MORE_FILTERS = [
  { key: 'fabric',    label: 'Fabric' },
  { key: 'price',     label: 'Price' },
  { key: 'standards', label: 'Standards' },
  { key: 'series',    label: 'Series' },
];
const moreToggle = document.querySelector('.more-toggle');

function openMoreList() {
  /* the product-view switch heads the panel, as it heads the mobile sheet
     (Figma 1-2313, "Desktop, 240 FILL"). It is a view control rather than a
     filter, so it sits above the divider and outside MORE_FILTERS — Reset
     must not clear it. */
  const pview = `
    <div class="dd-pview">
      <span>Show products on model</span>
      <button class="switch switch--sm" data-model-switch role="switch"
        aria-checked="${body.dataset.model === 'on'}"
        aria-label="Show products on model"><i></i></button>
    </div>`;
  dropdown.innerHTML = `<div class="dropdown__scroll">` + pview + MORE_FILTERS.map(f => `
    <div class="dd-group">
      <button class="dd-group__head"><span class="lbl">${f.label}</span>
        <svg class="chev" viewBox="0 0 7 4"><path d="M.5.5 3.5 3.5 6.5.5"/></svg></button>
      <div class="dd-group__body" hidden>${f.key === 'series' ? seriesGroupHTML() : optionRowsHTML(f.key)}</div>
    </div>`).join('') + `</div>` + FOOT_HTML;
  dropdown.dataset.facet = 'more';
  anchorDropdown(moreToggle);
  bindOptionRows();
  bindSeriesGroup();
  bindFoot(MORE_FILTERS.map(f => f.key));
  dropdown.querySelectorAll('.dd-group__head').forEach(head => {
    head.addEventListener('click', () => {
      const grpBody = head.nextElementSibling; /* not document.body */
      const willOpen = grpBody.hidden;
      /* exclusive — opening a group closes the current one */
      dropdown.querySelectorAll('.dd-group__body').forEach(b => b.hidden = true);
      dropdown.querySelectorAll('.dd-group__head').forEach(h => h.dataset.open = 'false');
      grpBody.hidden = !willOpen;
      head.dataset.open = String(willOpen);
      /* the panel measures its height from the chip, and opening a group
         changes how much there is to show — re-anchor so it keeps hugging
         the available space instead of holding a stale max-height */
      anchorDropdown(moreToggle);
    });
  });
  dropdown.querySelector('.dd-pview .switch').addEventListener('click', e => {
    e.stopPropagation();
    setOption('model', body.dataset.model === 'on' ? 'off' : 'on');
  });
}
moreToggle.addEventListener('click', e => {
  e.stopPropagation();
  if (ddChip === moreToggle) { if (!HAS_HOVER) closeDropdown(); return; }
  openMoreList();
});

/* ---- the row's own selected state (Figma 1-1328, State=Selected) ----
   Every chip prints how many of its options are applied, and a Reset
   filters link joins the end of the row. Without this the row looks
   untouched the moment a dropdown closes — a series picked four levels
   down the More list left no trace at all.
   Sort is a single choice with a default, so it shows its value in the
   label and never a count. "More" reports the sum of the facets it holds,
   which is the only way a Series pick is visible from the row. */
const CHIP_KEYS = new Map();
document.querySelectorAll('.filters--reduced button').forEach(chip => {
  CHIP_KEYS.set(chip, chip === moreToggle ? MORE_FILTERS.map(f => f.key) : [chip.dataset.f]);
  const n = document.createElement('span');
  n.className = 'chip__n';
  chip.insertBefore(n, chip.querySelector('svg'));
});
const rowReset = document.createElement('button');
rowReset.className = 'filters__reset';
rowReset.textContent = 'Reset filters';
rowReset.hidden = true;
document.querySelector('.filters--reduced').appendChild(rowReset);

function syncFilterRow() {
  let total = 0;
  CHIP_KEYS.forEach((keys, chip) => {
    const n = keys.filter(k => k !== 'sort')
      .reduce((s, k) => s + (ddState[k] ? ddState[k].size : 0), 0);
    chip.querySelector('.chip__n').textContent = n ? `(${n})` : '';
    total += n;
  });
  rowReset.hidden = !total;
}

rowReset.addEventListener('click', e => {
  e.stopPropagation();
  Object.keys(ddState).forEach(k => { if (k !== 'sort') ddState[k].clear(); });
  /* an open dropdown has to drop its ticks with the row */
  dropdown.querySelectorAll('[data-key][data-i]').forEach(b => {
    if (b.dataset.key !== 'sort') b.dataset.on = 'false';
  });
  syncDdFoot();
});

/* every Filter V1 chip opens on hover already (click stays for touch);
   a short grace period lets the pointer travel into the dropdown or
   across to the next chip */
if (window.matchMedia('(hover: hover)').matches) {
  let ddCloseTimer;
  const cancelDdClose = () => clearTimeout(ddCloseTimer);
  const scheduleDdClose = () => {
    cancelDdClose();
    ddCloseTimer = setTimeout(() => {
      /* never yank the dropdown out from under a focused field — the series
         search would otherwise vanish the moment the pointer drifted off it,
         mid-word */
      if (ddChip && !dropdown.contains(document.activeElement)) closeDropdown();
    }, 200);
  };
  /* the Reset link lives in the same row but opens nothing */
  document.querySelectorAll('.filters--reduced button:not(.filters__reset)').forEach(chip => {
    chip.addEventListener('mouseenter', () => {
      cancelDdClose();
      if (ddChip === chip) return;
      chip === moreToggle ? openMoreList() : openDropdown(chip);
    });
    chip.addEventListener('mouseleave', scheduleDdClose);
  });
  dropdown.addEventListener('mouseenter', cancelDdClose);
  dropdown.addEventListener('mouseleave', scheduleDdClose);
}

/* ============================================================
   DASHBOARD — every option is independent; state lives in data
   attributes on <body>, CSS reacts, a few options need JS hooks
   ============================================================ */
const dash = document.querySelector('.dash');
const dashToggle = document.querySelector('.dash-toggle');

/* the long-translation check — every chip carries its German label in
   data-long, and swapping them in is how the wrapping in .filters gets
   reviewed. The label is the button's leading text node, the chevron
   SVG follows it, so only that node is rewritten. */
const LABEL_BTNS = [...document.querySelectorAll('.results-row [data-long]')];
LABEL_BTNS.forEach(b => { b.dataset.short = b.firstChild.nodeValue.trim(); });
function applyLabels(long) {
  LABEL_BTNS.forEach(b => {
    b.firstChild.nodeValue = (long ? b.dataset.long : b.dataset.short) + ' ';
  });
}

const CONTROLS = {
  view:     ['products', 'content'],
  filters:  ['all', 'some', 'none'], /* all/none hidden in the panel but kept for deep links */
  labels:   ['short', 'long'], /* filter chip labels: EN vs the long German set */
  images:   ['new', 'live'],
  price:    ['a', 'b'],   /* price facet: A = min/max + range, B = bands */
  model:    ['on', 'off'], /* driven from the sheet's own switch; here for deep links */
};

/* the URL mirrors the panel — options at their default drop out of the
   query string, so the address bar is always a minimal shareable link */
const DEFAULTS = Object.fromEntries(Object.keys(CONTROLS).map(k => [k, body.dataset[k]]));
function syncURL() {
  const qs = new URLSearchParams(location.search);
  Object.keys(CONTROLS).forEach(k => {
    if (body.dataset[k] === DEFAULTS[k]) qs.delete(k);
    else qs.set(k, body.dataset[k]);
  });
  const q = qs.toString();
  try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) {}
}

function setOption(key, val) {
  if (!CONTROLS[key] || !CONTROLS[key].includes(val)) return;
  body.dataset[key] = val;
  if (key === 'images') {
    applyPhotos(val === 'live');
    /* reset variant selections + previews (back to the worn colour) */
    cards.forEach(card => {
      card.querySelector('.ph--variant').classList.remove('is-on');
      card._resetGallery();
      card.querySelectorAll('.thumb').forEach(t => t.dataset.sel = String(t.dataset.idx === '0'));
    });
  }
  if (key === 'labels') applyLabels(val === 'long');
  if (key === 'view') applyView(val);
  if (key === 'model') {
    applyModelView(val === 'on');
    /* the sheet's switch and the More dropdown's are the same control in two
       places — whichever was flipped, both have to read the new state */
    document.querySelectorAll('[data-model-switch]')
      .forEach(s => s.setAttribute('aria-checked', String(val === 'on')));
  }
  /* the images swap rebuilds every tile, so re-assert the product view */
  if (key === 'images' && body.dataset.model === 'off') applyModelView(false);
  if (key === 'price') sync();
  if (key === 'filters') { setDrawer(false); closeDropdown(); }
  closeAll();
  dash.querySelectorAll(`button[data-k="${key}"]`).forEach(b => b.dataset.on = String(b.dataset.val === val));
  syncURL();
  alignTiles();
}

dash.addEventListener('click', e => {
  const btn = e.target.closest('button[data-k]');
  if (btn) setOption(btn.dataset.k, btn.dataset.val);
});

dashToggle.addEventListener('click', () => {
  const open = body.classList.toggle('dash-open');
  dashToggle.setAttribute('aria-expanded', String(open));
});
/* open by default on desktop, collapsed on mobile */
if (window.innerWidth > 760) body.classList.add('dash-open');
else dashToggle.setAttribute('aria-expanded', 'false');

/* deep-link: plp.html?view=content&filters=some&member=v3&images=live&open=2
   (open forces the nth colour panel open — for review/screenshots) */
const params = new URLSearchParams(location.search);
Object.keys(CONTROLS).forEach(k => { if (params.get(k)) setOption(k, params.get(k)); });
alignTiles();
if (params.get('drawer')) setDrawer(true);
if (params.get('dd')) {
  const chip = document.querySelector(`.filters--reduced [data-f="${params.get('dd')}"]`);
  if (chip) requestAnimationFrame(() => openDropdown(chip));
}
if (params.get('open')) {
  const n = Math.max(1, parseInt(params.get('open'), 10) || 1) - 1;
  requestAnimationFrame(() => (cards[n] || cards[0]).classList.add('is-open'));
}
</script>

</body>
</html>
