  { cat: 'HIGH APEX LACE BRA',        pr: '£49.95', colors: 4, ph: P(1) },
  { cat: 'SATIN TRIM BRA',            pr: '£41.00', colors: 3, ph: P(3) },
];

/* the Triumph crown, inlined from Assets/plp/triumph-crown.svg (Amelie's
   export) so it can take currentColor and follow the member-price colour */
const CROWN = '<svg class="crown" viewBox="0 0 23 20" aria-hidden="true"><path d="M22.3766 5.22624L15.5607 16.0549L15.7389 0L15.6142 6.93399e-09L11.2574 15.8444L6.89607 4.92073e-07L6.77135 4.99014e-07L6.94954 16.0549L0.133636 5.22624H0L4.41919 19.7137L8.77602 16.7804L13.7342 16.7804L18.091 19.7137L22.5103 5.22624H22.3766Z"/></svg>';

/* new Blush & Burgundy product photos — from
   /FOR NEVER DONE BLUSH AND BURGUNDY/Colors combined (copied in) */
const PROD = n => `./Assets/plp/products/prod${String(n).padStart(2, '0')}.jpg`;
const PROD_PHOTOS = Array.from({ length: 23 }, (_, i) => PROD(i + 1));
/* photos hand-ordered: blush (B) and burgundy (Bu) alternate so a blush
   product always sits beside a burgundy one, AND look-alike shots are
   spread apart — the mauve-on-dark trio (5/6/7/20) and the redheads
   (3/13 · 10/14) never land next to each other. prod22 (2nd plaid
   redhead, a near-dupe of 10) is dropped for prod23 (burgundy dress). */
const PHOTO_ORDER = [1, 2, 5, 8, 6, 10, 16, 9, 4, 11, 7, 14, 20, 15, 13, 17, 3, 18, 19, 21, 12, 23];
PRODUCTS.forEach((p, i) => { p.ph = PROD(PHOTO_ORDER[i % PHOTO_ORDER.length]); });

/* ============================================================
   RENDER CARDS
   ============================================================ */
const grid = document.getElementById('grid');

/* alternate product photos for the hover gallery (4 per card) */
const GALLERY_POOL = PROD_PHOTOS;

PRODUCTS.forEach((p, i) => {
  /* 4 hover photos: the card's own + 3 rotating alternates */
  const others = GALLERY_POOL.filter(src => src !== p.ph);
  const gallery = [p.ph, others[i % others.length], others[(i + 2) % others.length], others[(i + 4) % others.length]];

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.gallery = gallery.join('|');

  /* panel thumbs: the worn colour (product photo crop) + fabric swatches */
  const swatchThumbs = SWATCHES.slice(0, p.colors - 1).map((s, j) => `
    <button class="thumb" data-photo="${s.photo}" data-idx="${j + 1}" data-sel="false" aria-label="${s.name}" title="${s.name}">
      <img src="${s.sw}" alt="${s.name}" loading="lazy" />
    </button>`).join('');

  card.innerHTML = `
    <div class="card__img">
      <img class="ph ph--base" src="${p.ph}" alt="${p.cat}" />
      <img class="ph ph--variant" src="${p.ph}" alt="" aria-hidden="true" />
      <img class="ph ph--hover" src="${gallery[1]}" alt="" aria-hidden="true" />
      ${p.sale ? '<span class="sale-flag">SALE</span>' : ''}
      <button class="gal-nav gal-nav--prev" aria-label="Previous photo"><svg viewBox="0 0 10 10"><path d="M6.5 1 2.5 5l4 4"/></svg></button>
      <button class="gal-nav gal-nav--next" aria-label="Next photo"><svg viewBox="0 0 10 10"><path d="M3.5 1l4 4-4 4"/></svg></button>
      <button class="wish" data-on="false" aria-label="Add to wishlist"><svg viewBox="0 0 24 24"><path class="hs" d="M10.4597 18.6328L11.9819 19.9434L13.5044 18.6328C14.9883 17.3571 16.2141 16.2543 17.1817 15.3244C18.1492 14.3945 18.9158 13.5628 19.4813 12.8291C20.0468 12.0955 20.4403 11.4162 20.6618 10.7912C20.8834 10.1661 20.9941 9.52346 20.9941 8.86331C20.9941 7.46189 20.5023 6.29151 19.5187 5.35217C18.5349 4.41296 17.309 3.94336 15.8411 3.94336C15.1066 3.94336 14.4073 4.07837 13.7432 4.3484C13.0793 4.61829 12.4922 5.00752 11.9819 5.51611C11.4718 5.00752 10.8847 4.61829 10.2206 4.3484C9.55672 4.07837 8.85743 3.94336 8.12275 3.94336C6.66185 3.94336 5.44185 4.41296 4.46277 5.35217C3.48368 6.29151 2.99414 7.46189 2.99414 8.86331C2.99414 9.53126 3.10691 10.1777 3.33246 10.8027C3.55801 11.4279 3.9515 12.1091 4.51294 12.8466C5.07452 13.584 5.83706 14.4158 6.80056 15.3419C7.76407 16.2679 8.98378 17.3649 10.4597 18.6328Z"/><path class="ho" d="M15.8408 4.44336C17.1912 4.44336 18.2899 4.87105 19.1729 5.71387C20.0544 6.55568 20.4941 7.59381 20.4941 8.86328C20.4941 9.46621 20.393 10.0523 20.1904 10.624C19.992 11.1839 19.6299 11.8164 19.085 12.5234C18.5395 13.2309 17.7918 14.0442 16.835 14.9639C15.8763 15.8852 14.6584 16.9818 13.1787 18.2539H13.1777L11.9814 19.2832L10.7861 18.2539H10.7852C9.31358 16.9897 8.10194 15.8988 7.14746 14.9814C6.19533 14.0663 5.45194 13.254 4.91113 12.5439C4.36932 11.8323 4.00572 11.1954 3.80273 10.6328C3.59698 10.0626 3.49414 9.47361 3.49414 8.86328C3.49415 7.5931 3.93146 6.55448 4.80859 5.71289C5.68701 4.87025 6.78027 4.44336 8.12305 4.44336C8.79466 4.4434 9.42974 4.56649 10.0322 4.81152C10.6343 5.05623 11.1657 5.40828 11.6289 5.87012L11.9814 6.22168L12.335 5.87012C12.7984 5.40827 13.3297 5.05622 13.9316 4.81152C14.5343 4.56649 15.1694 4.44339 15.8408 4.44336Z"/></svg></button>
    </div>
    <div class="card__info">
      <div class="card__cat">${p.cat}</div>
      <div class="card__pr${p.sale ? ' is-sale' : ''}"><span class="pr-now">${p.pr}</span>${p.sale ? `<span class="card__sale">${p.sale}</span>` : ''}${p.mem ? `<span class="mem"><span class="mem-std">Member price ${p.mem}</span><span class="mem-alt">${p.mem} for members${CROWN}</span><span class="mem-tag"><span class="mem-amt">${p.mem}</span><i class="mem-chip">Member price</i></span></span>` : ''}<button class="cvar__label" data-count="${p.colors}">+ ${p.colors} colors</button></div>
      <div class="panel" role="group" aria-label="Colours">
        <button class="thumb thumb--current" data-photo="${p.ph}" data-idx="0" data-sel="true" aria-label="Selected colour" title="Selected colour">
          <img src="${p.ph}" alt="" loading="lazy" />
        </button>
        ${swatchThumbs}
      </div>
    </div>`;

  grid.appendChild(card);
});

/* ============================================================
   EDITORIAL INTERRUPTORS — created once, re-slotted per version
   ============================================================ */
const mkTile = (cls, src) => {
  const t = document.createElement('div');
  t.className = 'ed ' + cls;
  t.innerHTML = `<img src="${src}" alt="" loading="lazy" />`;
  return t;
};
const edRow2 = mkTile('ed--row2', './Assets/plp/ed-peonies-wide.jpg');
const edTall = mkTile('ed--tall', './Assets/plp/ed-mood-pinkmemories.jpg');
const edLast = mkTile('ed--last', './Assets/plp/ed-hydrangea.jpg');

/* CONTENT TYPES media — a muted looping video replaces the second mood
   image (tall slot), the screenshot + "Discover this product" CTA
   replace the third (last slot); CSS scopes both to the "content"
   view, applyView() swaps the image source back and forth */
const moodVideo = document.createElement('video');
moodVideo.src = './Assets/plp/hero.mp4'; /* same clip as the hero banner */
moodVideo.muted = true;
moodVideo.loop = true;
moodVideo.playsInline = true;
moodVideo.preload = 'metadata';
edTall.appendChild(moodVideo);

const moodCta = document.createElement('button');
moodCta.className = 'mood-cta';
moodCta.textContent = 'Discover this product';
moodCta.addEventListener('click', () => { window.location.href = './pdp.html'; });
edLast.appendChild(moodCta);

const ED_LAST_SRC = './Assets/plp/ed-hydrangea.jpg';
const edLastImg = edLast.querySelector('img');
function applyView(v) {
  const content = v === 'content';
  edLastImg.src = content ? './Assets/plp/mood-screenshot.png' : ED_LAST_SRC;
  if (content) moodVideo.play().catch(() => {});
  else moodVideo.pause();
}

const cards = []; /* filled below, before the first placeTiles() */

/* editorial interruptor slots — before cards 5 (row 2), 12 (tall), 20 (last) */
function placeTiles() {
  grid.insertBefore(edRow2, cards[5] || null);
  grid.insertBefore(edTall, cards[12] || null);
  grid.insertBefore(edLast, cards[20] || null);
}

/* ============================================================
   "TRIUMPH LIVE" PHOTOS — tile images scraped from
   https://uk.triumph.com/bras (one per product, page order);
   swapped in while the Images option is on "Triumph live"
   ============================================================ */
const LIVE_PHOTOS = Array.from({ length: 22 }, (_, i) =>
  `./Assets/plp/live/live${String(i + 1).padStart(2, '0')}.webp`);

function applyPhotos(live) {
  cards.forEach((card, i) => {
    if (!card.dataset.galleryHome) card.dataset.galleryHome = card.dataset.gallery;
    const n = LIVE_PHOTOS.length;
    const gal = live
      ? [LIVE_PHOTOS[i % n], LIVE_PHOTOS[(i + 5) % n], LIVE_PHOTOS[(i + 11) % n], LIVE_PHOTOS[(i + 17) % n]]
      : card.dataset.galleryHome.split('|');
    card.dataset.gallery = gal.join('|');
    card.querySelector('.ph--base').src = gal[0];
    card.querySelector('.ph--variant').src = gal[0];
    const cur = card.querySelector('.thumb--current');
    cur.dataset.photo = gal[0];
    cur.querySelector('img').src = gal[0];
    /* colour swatches preview other live shots instead of the Figma photos */
    card.querySelectorAll('.panel .thumb:not(.thumb--current)').forEach((t, j) => {
      if (!t.dataset.photoHome) t.dataset.photoHome = t.dataset.photo;
      t.dataset.photo = live ? gal[(j + 1) % gal.length] : t.dataset.photoHome;
    });
  });
}

/* ============================================================
   "SHOW PRODUCTS ON MODEL" — the toggle at the top of the filter
   sheet (Figma 1-2313). There is no packshot set in this prototype,
   so the off state falls back to the garment-led crops already in
   Assets/plp/products — no faces, the product fills the frame.
   Swap PACKSHOTS for real packshots once they exist.
   ============================================================ */
const PACKSHOTS = [1, 2, 14, 18, 11, 22, 17, 8, 5].map(PROD);

function applyModelView(on) {
  cards.forEach((card, i) => {
    const src = on ? card.dataset.gallery.split('|')[0] : PACKSHOTS[i % PACKSHOTS.length];
    card.querySelector('.ph--base').src = src;
    card.querySelector('.ph--variant').src = src;
  });
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
const body = document.body;
cards.push(...document.querySelectorAll('.card'));
placeTiles();

/* hero video loops forever;
   the title fades in a second after playback starts */
const hero = document.querySelector('.hero');
const heroVideo = hero.querySelector('video');
const showHeroTitle = () => hero.classList.add('is-ended');
heroVideo.addEventListener('playing', () => setTimeout(showHeroTitle, 1000), { once: true });
heroVideo.addEventListener('error', showHeroTitle);
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) showHeroTitle();

/* keep the sticky results bar flush below the nav, whatever its real height */
const setHeaderH = () =>
  document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
setHeaderH();
window.addEventListener('resize', setHeaderH);

/* editorial tiles are trimmed so their images end level with the
   neighbouring photos (row2/last) or the second photo row (tall) */
function alignTiles() {
  const mobile = window.innerWidth <= 760;
  if (mobile) { [edRow2, edTall, edLast].forEach(t => t.style.height = ''); return; }
  const ref = cards.find(c => c.offsetParent) || cards[0];
  const photoH = ref.querySelector('.card__img').offsetHeight;
  [edRow2, edTall, edLast].forEach(t => t.style.height = photoH + 'px');
}
window.addEventListener('resize', alignTiles);
window.addEventListener('load', alignTiles);

/* ============================================================
   SCROLL REVEAL — one-shot blurred rise; everything entering the
   viewport animates together (no per-card stagger, so rows stay
   top-aligned during the fade-in)
   ============================================================ */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  [...grid.children].forEach(c => c.classList.add('is-visible'));
} else {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('is-visible');
      io.unobserve(en.target);
    });
  }, { threshold: .2, rootMargin: '0px 0px -10% 0px' });
  [...grid.children].forEach(c => io.observe(c));
}

function closeAll(except) {
  cards.forEach(c => { if (c !== except) c.classList.remove('is-open'); });
}

function swapImage(card, src) {
  const overlay = card.querySelector('.ph--variant');
  if (!src) { overlay.classList.remove('is-on'); return; }
  overlay.src = src;
  if (overlay.complete) overlay.classList.add('is-on');
  else overlay.onload = () => overlay.classList.add('is-on');
}

cards.forEach(card => {
  /* clicking the product (photo or title) opens the PDP;
     colour label / panel / gallery / heart keep their own behaviour */
  card.addEventListener('click', e => {
    if (e.target.closest('.thumb, .cvar__label, .panel, .gal-nav, .wish')) return;
    window.location.href = './pdp.html';
  });

  /* hover gallery — entering the photo shows a different shot,
     chevrons page through all 4; leaving restores the base photo
     (the photo set is read per call — versions may swap it) */
  const hoverImg = card.querySelector('.ph--hover');
  const imgWrap = card.querySelector('.card__img');
  let galIdx = 0;
  function showGal(i) {
    const gallery = card.dataset.gallery.split('|');
    galIdx = (i + gallery.length) % gallery.length;
    if (galIdx === 0) { hoverImg.classList.remove('is-on'); return; }
    hoverImg.src = gallery[galIdx];
    if (hoverImg.complete) hoverImg.classList.add('is-on');
    else hoverImg.onload = () => hoverImg.classList.add('is-on');
  }
  card._resetGallery = () => showGal(0);
  /* hover gallery is pointer-only — a tap on touch devices must not swap the photo */
  const isTouch = window.matchMedia('(hover: none)').matches;
  if (!isTouch) {
    imgWrap.addEventListener('mouseenter', () => showGal(1));
    imgWrap.addEventListener('mouseleave', () => showGal(0));
  }
  card.querySelector('.gal-nav--prev').addEventListener('click', e => { e.stopPropagation(); showGal(galIdx - 1); });
  card.querySelector('.gal-nav--next').addEventListener('click', e => { e.stopPropagation(); showGal(galIdx + 1); });

  /* touch — swipe left/right pages through the gallery */
  let tX = 0, tY = 0;
  imgWrap.addEventListener('touchstart', e => {
    tX = e.touches[0].clientX; tY = e.touches[0].clientY;
  }, { passive: true });
  imgWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tX;
    const dy = e.changedTouches[0].clientY - tY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) showGal(galIdx + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* wishlist heart */
  const wish = card.querySelector('.wish');
  wish.addEventListener('click', e => {
    e.stopPropagation();
    wish.dataset.on = wish.dataset.on === 'true' ? 'false' : 'true';
  });

  /* colour panel — desktop: hovering the label reveals it, leaving the
     info area closes it · touch: tap toggles, tap on the panel
     background closes */
  const cvarLabel = card.querySelector('.cvar__label');
  if (isTouch) {
    cvarLabel.addEventListener('click', e => {
      e.stopPropagation();
      const open = card.classList.contains('is-open');
      closeAll(card);
      card.classList.toggle('is-open', !open);
    });
  } else {
    cvarLabel.addEventListener('mouseenter', () => { closeAll(card); card.classList.add('is-open'); });
  }
  if (!isTouch) {
    card.querySelector('.card__info').addEventListener('mouseleave', () => card.classList.remove('is-open'));
  }
  card.querySelector('.panel').addEventListener('click', e => {
    e.stopPropagation();
    if (!e.target.closest('.thumb')) card.classList.remove('is-open');
  });

  /* swatch thumbnails — click selects + swaps the photo */
  card.querySelectorAll('.thumb').forEach(th => {
    th.addEventListener('click', e => {
      e.stopPropagation();
      card.querySelectorAll('.thumb').forEach(t => t.dataset.sel = String(t === th));
      /* the current-colour thumb restores the card's own photo */
      swapImage(card, th.dataset.idx === '0' ? null : th.dataset.photo);
    });
  });
});

/* click outside closes open panels */
document.addEventListener('click', e => {
  if (!e.target.closest('.card')) closeAll();
});

/* ============================================================
   FILTER & SORT — facet data (Figma 21-5889 "FILTER – MOBILE")
   Every option carries the design's own count: the sheet prints it
   beside the label, and the CTA reports the narrowest count of
   everything currently set (Figma note 1-1773).
   ============================================================ */
const TOTAL_RESULTS = 36;

/* Series is two levels deep — a family, then its lines. "All <family>"
   is its own option that clears the individual lines; whether it should
   instead tick every child is still open (Figma note 1-1782). */
const SERIES = [
  { n: 'Amourette', c: 18, items: [
    { n: 'All Amourette', c: 18, all: true },
    { n: 'Amourette Charm', c: 4 }, { n: 'Amourette Spotlight', c: 8 }, { n: 'Amourette 300', c: 6 } ] },
  { n: 'Aura', c: 12, items: [
    { n: 'All Aura', c: 12, all: true },
    { n: 'Aura Spotlight', c: 7 }, { n: 'Aura Sensation', c: 5 } ] },
  { n: 'Body Make-Up', c: 9, items: [
    { n: 'All Body Make-Up', c: 9, all: true },
    { n: 'Body Make-Up Soft Touch', c: 5 }, { n: 'Body Make-Up Essentials', c: 4 } ] },
  { n: 'Signature Sheer', c: 7, items: [
    { n: 'All Signature Sheer', c: 7, all: true },
    { n: 'Signature Sheer Lace', c: 4 }, { n: 'Signature Sheer Minimizer', c: 3 } ] },
  { n: 'Doreen', c: 5, items: [
    { n: 'All Doreen', c: 5, all: true },
    { n: 'Doreen Cotton', c: 3 } ] },
];

/* the swatch set this page already ships — blush and burgundy lead it */
const COLOUR_COUNTS = { Black: 8, Burgundy: 12, Red: 6, Pink: 14, Teal: 3 };

const FACETS = [
  { key: 'sort', label: 'Sort by', type: 'radio', on: 0,
    items: [{ n: 'Newest' }, { n: 'Price (low – high)' }, { n: 'Price (high – low)' }, { n: 'Bestsellers' }] },
  { key: 'category', label: 'Category', type: 'list',
    items: [{ n: 'Bras', c: 24 }, { n: 'Knickers', c: 18 }, { n: 'Bodies', c: 6 }, { n: 'Nightwear', c: 9 }, { n: 'Shapewear', c: 5 }] },
  /* Size and Colour start open — the note (1-1767) asks for the most
     important facets expanded by default, "here e.g. Size & Color" */
  /* the chips carry counts too, for the results arithmetic only — the
     design deliberately keeps numbers off the size grid */
  { key: 'size', label: 'Size', type: 'sizes', open: true, grids: [
    { label: 'Underbust size', items: [['70', 11], ['75', 19], ['80', 22], ['85', 18], ['90', 12], ['100', 7], ['105', 5], ['110', 4]] },
    { label: 'Cup size',       items: [['A', 8], ['B', 17], ['C', 20], ['D', 16], ['E', 11], ['F', 7], ['G', 5], ['H', 3]] } ] },
  { key: 'colour', label: 'Colour', type: 'colours', open: true,
    items: SWATCHES.map(s => ({ n: s.name, c: COLOUR_COUNTS[s.name], sw: s.sw })) },
  { key: 'fabrics', label: 'Fabrics', type: 'list',
    items: [{ n: 'Lace', c: 14 }, { n: 'Satin', c: 9 }, { n: 'Mesh', c: 6 }, { n: 'Cotton', c: 11 }] },
  /* the bands partition all 36 products, so option A can add up the ones
     its range covers and option B just reports the band it picked */
  { key: 'price', label: 'Price', type: 'price', min: 25, max: 65, bands: [
    { n: 'Under £40', c: 6, lo: 25, hi: 40 }, { n: '£40 – £50', c: 12, lo: 40, hi: 50 },
    { n: '£50 – £60', c: 11, lo: 50, hi: 60 }, { n: 'Over £60', c: 7, lo: 60, hi: 65 } ] },
  { key: 'series', label: 'Series', type: 'series', groups: SERIES },
  { key: 'standards', label: 'Product standards & traceability', type: 'list',
    items: [{ n: 'OEKO-TEX®', c: 21 }, { n: 'Recycled materials', c: 9 }, { n: 'Organic cotton', c: 6 }] },
];

/* ============================================================
   RENDER THE FACETS
   ============================================================ */
const TICK = '<svg class="opt__tick" viewBox="0 0 10 8"><path d="M1 4l2.9 2.9L9 1.4"/></svg>';
const CHEV = '<svg viewBox="0 0 10 6"><path d="M.5.5 5 5 9.5.5"/></svg>';
const cnt = c => (c == null ? '' : ` <i>(${c})</i>`);
const optRow = (o, on, cls = '') =>
  `<button class="opt${cls}" data-on="${!!on}"${o.c != null ? ` data-c="${o.c}"` : ''}${o.all ? ' data-all="true"' : ''}>${o.n}${cnt(o.c)}${TICK}</button>`;

const facetsEl = document.getElementById('facets');
const facetEls = [];
/* below this width the panel is the bottom sheet: accordions stack open,
   above it the drawer keeps its one-at-a-time behaviour */
const isSheet = () => window.matchMedia('(max-width: 760px)').matches;

FACETS.forEach((f, i) => {
  let inner = '';
  if (f.type === 'radio' || f.type === 'list') {
    inner = f.items.map((o, j) => optRow(o, f.type === 'radio' && j === f.on)).join('');
  } else if (f.type === 'sizes') {
    inner = `<div class="grids">${f.grids.map(g => `
      <div>
        <div class="grid-lb">${g.label}</div>
        <div class="chips">${g.items.map(([s, c]) => `<button data-on="false" data-c="${c}">${s}</button>`).join('')}</div>
      </div>`).join('')}</div>`;
  } else if (f.type === 'colours') {
    inner = `<div class="cols">${f.items.map(o => `
      <button class="col" data-on="false" data-c="${o.c}" aria-label="${o.n}">
        <span class="col__sw"><img src="${o.sw}" alt="" loading="lazy" /></span>
        <span class="col__lb">${o.n}${cnt(o.c)}</span>
      </button>`).join('')}</div>`;
  } else if (f.type === 'price') {
    inner = `
      <div class="pr-a">
        <div class="pr__fields">
          <label class="pr__box"><span>Min.</span><input type="text" inputmode="numeric" class="pr__in pr__in--lo" value="£${f.min}" aria-label="Minimum price" /></label>
          <i class="pr__dash">–</i>
          <label class="pr__box"><span>Max.</span><input type="text" inputmode="numeric" class="pr__in pr__in--hi" value="£${f.max}" aria-label="Maximum price" /></label>
        </div>
        <div class="pr__slider">
          <div class="pr__track"></div><div class="pr__fill"></div>
          <input type="range" class="pr__r pr__r--lo" min="${f.min}" max="${f.max}" value="${f.min}" aria-label="Minimum price" />
          <input type="range" class="pr__r pr__r--hi" min="${f.min}" max="${f.max}" value="${f.max}" aria-label="Maximum price" />
        </div>
      </div>
      <div class="pr-b">${f.bands.map(b => optRow(b, false)).join('')}</div>`;
  } else if (f.type === 'series') {
    inner = `
      <div class="srch">
        <input type="search" placeholder="Search series" aria-label="Search series" />
        <svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.6"/><path d="M9.4 9.4 13 13"/></svg>
      </div>
      ${f.groups.map(g => `
        <div class="grp">
          <button class="grp__head">${g.n}${cnt(g.c)}${CHEV}</button>
          <div class="grp__body">${g.items.map(o => optRow(o, false)).join('')}</div>
        </div>`).join('')}
      <div class="srch-empty" hidden>No series match that search.</div>`;
  }

  const facet = document.createElement('div');
  facet.className = 'facet facet--' + f.key;
  facet.dataset.i = i;
  if (f.open) facet.classList.add('is-open');
  facet.innerHTML = `
    <button class="facet__head">
      <span class="facet__txt">
        <span class="facet__lb">${f.label}<i class="facet__n"></i></span>
        ${f.type === 'radio' ? '<span class="facet__val"></span>' : ''}
      </span>
      ${CHEV}
    </button>
    <div class="facet__body"><div class="facet__inner">${inner}</div></div>`;

  facet.querySelector('.facet__head').addEventListener('click', () => {
    const open = facet.classList.contains('is-open');
    if (!isSheet()) facetEls.forEach(x => x.classList.remove('is-open'));
    facet.classList.toggle('is-open', !open);
  });

  /* option rows and chips — Sort by is a radio, everything else toggles.
     Inside Series, "All <family>" and its lines are mutually exclusive. */
  facet.addEventListener('click', e => {
    const btn = e.target.closest('.opt, .chips button, .col');
    if (!btn || !facet.contains(btn)) return;
    const wasOn = btn.dataset.on === 'true';
    if (f.type === 'radio') {
      facet.querySelectorAll('.opt').forEach(b => b.dataset.on = 'false');
      btn.dataset.on = 'true';
    } else if (f.type === 'price') {
      /* option B is one band at a time */
      facet.querySelectorAll('.pr-b .opt').forEach(b => b.dataset.on = 'false');
      btn.dataset.on = String(!wasOn);
    } else if (f.type === 'series' && btn.classList.contains('opt')) {
      const grp = btn.closest('.grp');
      const isAll = btn.dataset.all === 'true';
      grp.querySelectorAll(isAll ? '.opt:not([data-all])' : '.opt[data-all]').forEach(b => b.dataset.on = 'false');
      btn.dataset.on = String(!wasOn);
    } else {
      btn.dataset.on = String(!wasOn);
    }
    sync();
  });

  /* series: group accordions + live search over family and line names */
  if (f.type === 'series') {
    facet.querySelectorAll('.grp__head').forEach(h => {
      h.addEventListener('click', () => h.closest('.grp').classList.toggle('is-open'));
    });
    const input = facet.querySelector('.srch input');
    const empty = facet.querySelector('.srch-empty');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      let hits = 0;
      facet.querySelectorAll('.grp').forEach(g => {
        const hit = !q || g.textContent.toLowerCase().includes(q);
        g.hidden = !hit;
        if (hit) { hits++; if (q) g.classList.add('is-open'); }
      });
      empty.hidden = hits > 0;
    });
  }

  /* price option A: two overlapping ranges, kept in order, mirrored
     into the min/max fields (and typing in a field moves the thumb) */
  if (f.type === 'price') {
    const rLo = facet.querySelector('.pr__r--lo'), rHi = facet.querySelector('.pr__r--hi');
    const inLo = facet.querySelector('.pr__in--lo'), inHi = facet.querySelector('.pr__in--hi');
    const fill = facet.querySelector('.pr__fill');
    const paint = () => {
      const lo = +rLo.value, hi = +rHi.value, span = f.max - f.min;
      fill.style.left  = `calc(8px + ${(lo - f.min) / span} * (100% - 16px))`;
      fill.style.right = `calc(8px + ${(f.max - hi) / span} * (100% - 16px))`;
      inLo.value = '£' + lo; inHi.value = '£' + hi;
    };
    rLo.addEventListener('input', () => { if (+rLo.value > +rHi.value) rLo.value = rHi.value; paint(); sync(); });
    rHi.addEventListener('input', () => { if (+rHi.value < +rLo.value) rHi.value = rLo.value; paint(); sync(); });
    const typed = (input, range, other, isLo) => {
      const v = parseInt(input.value.replace(/[^\d]/g, ''), 10);
      if (!isNaN(v)) {
        range.value = Math.min(f.max, Math.max(f.min, v));
        if (isLo && +range.value > +other.value) other.value = range.value;
        if (!isLo && +range.value < +other.value) other.value = range.value;
      }
      paint(); sync();
    };
    inLo.addEventListener('change', () => typed(inLo, rLo, rHi, true));
    inHi.addEventListener('change', () => typed(inHi, rHi, rLo, false));
    facet._price = { rLo, rHi, paint };
    paint();
  }

  facetEls.push(facet);
  facetsEl.appendChild(facet);
});

/* ============================================================
   PANEL STATE — per-facet counts, the header count, and the CTA
   ============================================================ */
const drawerN = document.getElementById('drawerN');
const clearBtn = document.querySelector('.drawer__clear');
const ctaBtn = document.querySelector('.drawer__cta');

/* price is "set" only once the range is actually narrowed; its count is
   the sum of the bands the range still covers */
function priceState() {
  const f = FACETS.find(x => x.key === 'price');
  const facet = facetEls[FACETS.indexOf(f)];
  if (document.body.dataset.price === 'b') {
    const on = facet.querySelector('.pr-b .opt[data-on="true"]');
    return on ? { n: 1, c: +on.dataset.c } : { n: 0 };
  }
  const lo = +facet._price.rLo.value, hi = +facet._price.rHi.value;
  if (lo === f.min && hi === f.max) return { n: 0 };
  const c = f.bands.filter(b => b.lo < hi && b.hi > lo).reduce((s, b) => s + b.c, 0);
  return { n: 1, c: Math.max(1, c) };
}

/* Within one facet the choices are alternatives, so their counts add up;
   across facets they narrow each other, so the smallest count wins. Size
   holds two independent grids (underbust AND cup), so each counts alone. */
function facetCounts(el, f) {
  const groups = f.type === 'sizes' ? [...el.querySelectorAll('.chips')] : [el];
  const out = [];
  groups.forEach(g => {
    let sum = 0, any = false;
    g.querySelectorAll('[data-on="true"][data-c]').forEach(b => { sum += +b.dataset.c; any = true; });
    if (any) out.push(Math.min(TOTAL_RESULTS, sum));
  });
  return out;
}

function sync() {
  let total = 0;
  const counts = [];
  FACETS.forEach((f, i) => {
    const el = facetEls[i];
    let n = 0;
    if (f.key === 'sort') {
      const on = el.querySelector('.opt[data-on="true"]');
      el.querySelector('.facet__val').textContent = on ? on.textContent.trim() : '';
    } else if (f.type === 'price') {
      const p = priceState();
      n = p.n;
      if (p.c != null) counts.push(p.c);
    } else {
      n = el.querySelectorAll('[data-on="true"]').length;
      counts.push(...facetCounts(el, f));
    }
    el.querySelector('.facet__n').textContent = n ? ` (${n})` : '';
    total += n;
  });
  drawerN.textContent = total ? `(${total})` : '';
  clearBtn.hidden = !total;
  const results = counts.length ? Math.min(...counts) : TOTAL_RESULTS;
  ctaBtn.textContent = total ? `Show ${results} results` : 'Show results';
}

/* Reset wipes every facet at once; the sort choice is not a filter */
clearBtn.addEventListener('click', () => {
  FACETS.forEach((f, i) => {
    if (f.key === 'sort') return;
    const el = facetEls[i];
    el.querySelectorAll('[data-on="true"]').forEach(b => b.dataset.on = 'false');
    if (f.type === 'price') {
      el._price.rLo.value = f.min; el._price.rHi.value = f.max; el._price.paint();
    }
    if (f.type === 'series') {
      const input = el.querySelector('.srch input');
      input.value = '';
      el.querySelectorAll('.grp').forEach(g => { g.hidden = false; g.classList.remove('is-open'); });
      el.querySelector('.srch-empty').hidden = true;
    }
  });
  sync();
});

/* ============================================================
   OPEN / CLOSE — the drawer slides in from the right on desktop and
   rises as a bottom sheet on mobile, where it can also be swiped away
   (Figma note 1-1788)
   ============================================================ */
const drawer = document.querySelector('.drawer');

/* freeze the page behind the sheet without losing the reader's place */
let lockY = 0;
function lockPage(on) {
  if (!isSheet()) { document.body.style.top = ''; return; }
  if (on) {
    lockY = window.scrollY;
    document.body.style.top = `-${lockY}px`;
  } else {
    document.body.style.top = '';
    /* the frozen body has no scroll height, so force a reflow first —
       otherwise scrollTo clamps to one viewport and lands near the top */
    void document.body.offsetHeight;
    window.scrollTo(0, lockY);
  }
}

function setDrawer(open) {
  if (open) lockPage(true);
  document.body.classList.toggle('drawer-open', open);
  drawer.setAttribute('aria-hidden', String(!open));
  if (!open) lockPage(false);
}
document.getElementById('drawerTrigger').addEventListener('click', () => setDrawer(true));
document.querySelector('.filters-mobile').addEventListener('click', () => setDrawer(true));
document.querySelector('.drawer__close').addEventListener('click', () => setDrawer(false));
ctaBtn.addEventListener('click', () => setDrawer(false));
document.getElementById('scrim').addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });

/* swipe down on the header (the grab bar sits on it) to dismiss —
   past a third of the sheet, or a quick flick, closes it */
(() => {
  const head = drawer.querySelector('.drawer__head');
  let y0 = 0, t0 = 0, dy = 0, live = false;
  const end = () => {
    if (!live) return;
    live = false;
    drawer.classList.remove('is-dragging');
    drawer.style.transform = '';
    const fast = dy > 40 && (performance.now() - t0) < 300;
    if (dy > drawer.offsetHeight / 3 || fast) setDrawer(false);
  };
  head.addEventListener('pointerdown', e => {
    if (!isSheet() || e.target.closest('.drawer__close')) return;
    live = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    drawer.classList.add('is-dragging');
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!live) return;
    dy = Math.max(0, e.clientY - y0);
    drawer.style.transform = `translateY(${dy}px)`;
  });
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
})();

/* the product view switch — the sheet is where this option really lives,
   so it drives the shared body state rather than a dashboard row */
const modelSwitch = document.getElementById('modelSwitch');
modelSwitch.addEventListener('click', () => {
  setOption('model', modelSwitch.getAttribute('aria-checked') === 'true' ? 'off' : 'on');
});

sync();

/* ============================================================
   FILTER V1 — chip dropdowns (Figma 931-26774) + More dropdown
   ============================================================ */
const DD_ITEMS = {
  size: ['70A', '70B', '75A', '75B', '75C', '80B', '80C', '85B'],
  colour: [
    { name: 'Red',   c: '#C1003F' }, { name: 'Blue',  c: '#3B82F6' },
    { name: 'Green', c: '#10B981' }, { name: 'Black', c: '#000000' },
    { name: 'White', c: '#FFFFFF' }, { name: 'Pink',  c: '#EC4899' },
    { name: 'Grey',  c: '#6B7280' },
  ],
  series: ['Love in Lace', 'Aura Spotlight', 'Signature Sheer', 'Body Make-Up'],
  fabric: ['Lace', 'Satin', 'Mesh', 'Cotton'],
  price: ['Under £30', '£30 – £50', 'Over £50'],
  standards: ['OEKO-TEX Standard 100', 'Recycled materials', 'Organic cotton'],
  sort: ['Newest', 'Price (low – high)', 'Price (high – low)', 'Bestsellers'],
};
const ddState = { sort: new Set([0]) }; /* per facet: selected indices */

const resultsRow = document.querySelector('.results-row');
const dropdown = document.createElement('div');
dropdown.className = 'dropdown';
resultsRow.appendChild(dropdown);
let ddChip = null;

/* sits below the anchor chip, kept inside the row */
function anchorDropdown(chip) {
  const rowRect = resultsRow.getBoundingClientRect();
  const r = chip.getBoundingClientRect();
  dropdown.style.left = Math.min(r.left - rowRect.left, resultsRow.clientWidth - 240 - 24) + 'px';
  dropdown.style.top = (r.bottom - rowRect.top + 8) + 'px';
  dropdown.classList.add('is-open');
  ddChip = chip;
}

/* option rows for one facet — shared by the chip dropdowns and the
   "More" accordion */
function optionRowsHTML(key) {
  const sel = ddState[key] || (ddState[key] = new Set());
  return DD_ITEMS[key].map((it, i) => {
    const name = typeof it === 'string' ? it : it.name;
    const sw = typeof it === 'string' ? '' : `<span class="sw" style="background:${it.c}"></span>`;
    return `<button class="dropdown__row" data-key="${key}" data-i="${i}" data-on="${sel.has(i)}">${sw}<span class="lbl">${name}</span>
      <svg class="tick" viewBox="0 0 16 16"><path d="M2.5 8.5 6.5 12.5 13.5 4"/></svg></button>`;
  }).join('');
}

function bindOptionRows() {
  dropdown.querySelectorAll('.dropdown__row[data-i]').forEach(rowBtn => {
    rowBtn.addEventListener('click', () => {
      const key = rowBtn.dataset.key;
      const sel = ddState[key];
      const i = +rowBtn.dataset.i;
      if (key === 'sort') { /* single choice */
        sel.clear(); sel.add(i);
        dropdown.querySelectorAll('.dropdown__row[data-key="sort"]').forEach(b => b.dataset.on = 'false');
        rowBtn.dataset.on = 'true';
        return;
      }
      sel.has(i) ? sel.delete(i) : sel.add(i);
      rowBtn.dataset.on = String(sel.has(i));
    });
  });
}

function bindFoot(keys) {
  dropdown.querySelector('.dd-reset').addEventListener('click', () => {
    keys.forEach(k => ddState[k] && ddState[k].clear());
    dropdown.querySelectorAll('.dropdown__row[data-i]').forEach(b => b.dataset.on = 'false');
  });
  dropdown.querySelector('.dd-save').addEventListener('click', closeDropdown);
}

function openDropdown(chip, key = chip.dataset.f) {
  dropdown.innerHTML = optionRowsHTML(key) + `
    <div class="dropdown__foot"><button class="dd-reset">Reset</button><button class="dd-save">Save</button></div>`;
  anchorDropdown(chip);
  bindOptionRows();
  bindFoot([key]);
}
function closeDropdown() {
  dropdown.classList.remove('is-open');
  ddChip = null;
}
document.querySelectorAll('.filters--reduced [data-f]').forEach(chip => {
  chip.addEventListener('click', e => {
    e.stopPropagation();
    if (ddChip === chip) { closeDropdown(); return; }
    openDropdown(chip);
  });
});
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown, .filters--reduced')) closeDropdown();
});

/* "More" lists the remaining filters in ONE dropdown; each expands
   its options in place (accordion), no separate view */
const MORE_FILTERS = [
  { key: 'fabric',    label: 'Fabric' },
  { key: 'price',     label: 'Price' },
  { key: 'series',    label: 'Series' },
  { key: 'standards', label: 'Standards' },
];
const moreToggle = document.querySelector('.more-toggle');
function openMoreList() {
  dropdown.innerHTML = MORE_FILTERS.map(f => `
    <div class="dd-group">
      <button class="dd-group__head"><span class="lbl">${f.label}</span>
        <svg class="chev" viewBox="0 0 7 4"><path d="M.5.5 3.5 3.5 6.5.5"/></svg></button>
      <div class="dd-group__body" hidden>${optionRowsHTML(f.key)}</div>
    </div>`).join('') + `
    <div class="dropdown__foot"><button class="dd-reset">Reset</button><button class="dd-save">Save</button></div>`;
  anchorDropdown(moreToggle);
  bindOptionRows();
  bindFoot(MORE_FILTERS.map(f => f.key));
  dropdown.querySelectorAll('.dd-group__head').forEach(head => {
    head.addEventListener('click', () => {
      const body = head.nextElementSibling;
      const willOpen = body.hidden;
      /* exclusive — opening a group closes the current one */
      dropdown.querySelectorAll('.dd-group__body').forEach(b => b.hidden = true);
      dropdown.querySelectorAll('.dd-group__head').forEach(h => h.dataset.open = 'false');
      body.hidden = !willOpen;
      head.dataset.open = String(willOpen);
    });
  });
}
moreToggle.addEventListener('click', e => {
  e.stopPropagation();
  if (ddChip === moreToggle) { closeDropdown(); return; }
  openMoreList();
});
/* every Filter V1 chip opens on hover already (click stays for touch);
   a short grace period lets the pointer travel into the dropdown or
   across to the next chip */
if (window.matchMedia('(hover: hover)').matches) {
  let ddCloseTimer;
  const cancelDdClose = () => clearTimeout(ddCloseTimer);
  const scheduleDdClose = () => {
    cancelDdClose();
    ddCloseTimer = setTimeout(() => { if (ddChip) closeDropdown(); }, 200);
  };
  document.querySelectorAll('.filters--reduced button').forEach(chip => {
    chip.addEventListener('mouseenter', () => {
      cancelDdClose();
      if (ddChip === chip) return;
      chip === moreToggle ? openMoreList() : openDropdown(chip);
    });
    chip.addEventListener('mouseleave', scheduleDdClose);
  });
  dropdown.addEventListener('mouseenter', cancelDdClose);
  dropdown.addEventListener('mouseleave', scheduleDdClose);
}

/* ============================================================
   DASHBOARD — every option is independent; state lives in data
   attributes on <body>, CSS reacts, a few options need JS hooks
   ============================================================ */
const dash = document.querySelector('.dash');
const dashToggle = document.querySelector('.dash-toggle');

const CONTROLS = {
  view:     ['products', 'content'],
  filters:  ['all', 'some', 'none'], /* all/none hidden in the panel but kept for deep links */
  member:   ['v1', 'v2', 'v3'],
  images:   ['new', 'live'],
  price:    ['a', 'b'],   /* price facet: A = min/max + range, B = bands */
  model:    ['on', 'off'], /* driven from the sheet's own switch; here for deep links */
};

/* the URL mirrors the panel — options at their default drop out of the
   query string, so the address bar is always a minimal shareable link */
const DEFAULTS = Object.fromEntries(Object.keys(CONTROLS).map(k => [k, body.dataset[k]]));
function syncURL() {
  const qs = new URLSearchParams(location.search);
  Object.keys(CONTROLS).forEach(k => {
    if (body.dataset[k] === DEFAULTS[k]) qs.delete(k);
    else qs.set(k, body.dataset[k]);
  });
  const q = qs.toString();
  try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) {}
}

function setOption(key, val) {
  if (!CONTROLS[key] || !CONTROLS[key].includes(val)) return;
  body.dataset[key] = val;
  if (key === 'images') {
    applyPhotos(val === 'live');
    /* reset variant selections + previews (back to the worn colour) */
    cards.forEach(card => {
      card.querySelector('.ph--variant').classList.remove('is-on');
      card._resetGallery();
      card.querySelectorAll('.thumb').forEach(t => t.dataset.sel = String(t.dataset.idx === '0'));
    });
  }
  if (key === 'view') applyView(val);
  if (key === 'model') {
    applyModelView(val === 'on');
    modelSwitch.setAttribute('aria-checked', String(val === 'on'));
  }
  /* the images swap rebuilds every tile, so re-assert the product view */
  if (key === 'images' && body.dataset.model === 'off') applyModelView(false);
  if (key === 'price') sync();
  if (key === 'filters') { setDrawer(false); closeDropdown(); }
  closeAll();
  dash.querySelectorAll(`button[data-k="${key}"]`).forEach(b => b.dataset.on = String(b.dataset.val === val));
  syncURL();
  alignTiles();
}

dash.addEventListener('click', e => {
  const btn = e.target.closest('button[data-k]');
  if (btn) setOption(btn.dataset.k, btn.dataset.val);
});

dashToggle.addEventListener('click', () => {
  const open = body.classList.toggle('dash-open');
  dashToggle.setAttribute('aria-expanded', String(open));
});
/* open by default on desktop, collapsed on mobile */
if (window.innerWidth > 760) body.classList.add('dash-open');
else dashToggle.setAttribute('aria-expanded', 'false');

/* deep-link: plp.html?view=content&filters=some&member=v3&images=live&open=2
   (open forces the nth colour panel open — for review/screenshots) */
const params = new URLSearchParams(location.search);
Object.keys(CONTROLS).forEach(k => { if (params.get(k)) setOption(k, params.get(k)); });
alignTiles();
if (params.get('drawer')) setDrawer(true);
if (params.get('dd')) {
  const chip = document.querySelector(`.filters--reduced [data-f="${params.get('dd')}"]`);
  if (chip) requestAnimationFrame(() => openDropdown(chip));
}
if (params.get('open')) {
  const n = Math.max(1, parseInt(params.get('open'), 10) || 1) - 1;
  requestAnimationFrame(() => (cards[n] || cards[0]).classList.add('is-open'));
}
</script>

</body>
